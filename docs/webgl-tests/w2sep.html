<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>w2sep</title></head>
<body><canvas id="c1" width="8" height="8"></canvas><canvas id="c2" width="8" height="8"></canvas>
<script>
var out=[];
document.addEventListener('webglcontextcreationerror', function(e){
  out.push('creationError='+(e.statusMessage||'none'));
  document.title='W2| '+out.join(' | ');
});
var gl1=document.getElementById('c1').getContext('webgl', {failIfMajorPerformanceCaveat:false});
out.push('webgl1='+(gl1?'yes':'no'));
if(gl1){
  var d=gl1.getExtension('WEBGL_debug_renderer_info');
  out.push('r='+(d?gl1.getParameter(d.UNMASKED_RENDERER_WEBGL):'?'));
  out.push('v='+gl1.getParameter(gl1.VERSION));
  out.push('s='+gl1.getParameter(gl1.SHADING_LANGUAGE_VERSION));
}
var gl2=document.getElementById('c2').getContext('webgl2', {failIfMajorPerformanceCaveat:false});
out.push('webgl2='+(gl2?'yes':'no'));
if(gl2){
  var d2=gl2.getExtension('WEBGL_debug_renderer_info');
  out.push('r2='+(d2?gl2.getParameter(d2.UNMASKED_RENDERER_WEBGL):'?'));
  out.push('v2='+gl2.getParameter(gl2.VERSION));
  out.push('s2='+gl2.getParameter(gl2.SHADING_LANGUAGE_VERSION));
  try { out.push('fbo='+gl2.checkFramebufferStatus(gl2.FRAMEBUFFER)); } catch(e){ out.push('fbo=err:'+e.message); }
  var buf = gl2.createBuffer();
  gl2.bindBuffer(gl2.ARRAY_BUFFER, buf);
  gl2.bufferData(gl2.ARRAY_BUFFER, new Float32Array([1,2,3,4]), gl2.STATIC_DRAW);
  var e = gl2.getError();
  out.push('bufErr='+e);
  try {
    var prog = gl2.createProgram();
    out.push('prog='+(prog?'yes':'no'));
  } catch(e){ out.push('prog=err:'+e.message); }
}
document.title='W2| '+out.join(' | ');
try{ console.log('W2 '+out.join(' | ')); }catch(e){}
</script>
</body></html>
