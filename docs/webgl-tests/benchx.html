<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>benchx</title></head>
<body><canvas id="c" width="1024" height="1024"></canvas>
<script>
"use strict";
var mode=(location.hash||'#gl1');
var out=[];
var gl=document.getElementById('c').getContext(mode=='#gl2'?'webgl2':'webgl',{failIfMajorPerformanceCaveat:false});
if(!gl){ document.title='benchx| NOCTX'; }
else {
  var is2=mode=='#gl2';
  out.push('mode='+mode);
  out.push('ver='+gl.getParameter(gl.VERSION));
  var vsInst=is2?
    '#version 300 es\nlayout(location=0) in vec2 aPos;layout(location=1) in mat4 aWorld;out vec4 vc;void main(){gl_Position=aWorld*vec4(aPos,0.0,1.0);vc=aWorld[3];}':
    'precision mediump float;attribute vec2 aPos;attribute mat4 aWorld;varying vec4 vc;void main(){gl_Position=aWorld*vec4(aPos,0.0,1.0);vc=aWorld[3];}';
  var vsObj=is2?
    '#version 300 es\nlayout(location=0) in vec2 aPos;uniform mat4 world;void main(){gl_Position=world*vec4(aPos,0.0,1.0);}':
    'precision mediump float;attribute vec2 aPos;uniform mat4 world;void main(){gl_Position=world*vec4(aPos,0.0,1.0);}';
  var fs=is2?
    '#version 300 es\nprecision mediump float;in vec4 vc;out vec4 o;void main(){o=vec4(1.0,0.4,0.2,1.0);}':
    'precision mediump float;varying vec4 vc;void main(){gl_FragColor=vec4(1.0,0.4,0.2,1.0);}';
  function mk(t,s){var r=gl.createShader(t);gl.shaderSource(r,s);gl.compileShader(r);if(!gl.getShaderParameter(r,gl.COMPILE_STATUS))throw 'sh:'+gl.getShaderInfoLog(r);return r;}
  function mkp(v,f){var p=gl.createProgram();gl.attachShader(p,mk(gl.VERTEX_SHADER,v));gl.attachShader(p,mk(gl.FRAGMENT_SHADER,f));gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw 'lp:'+gl.getProgramInfoLog(p);return p;}
  var pI=mkp(vsInst,fs), pO=mkp(vsObj,fs);
  var worldO=gl.getUniformLocation(pO,'world');
  var MAXN=5000, S=128; // SxS instance grid
  var inst=new Float32Array(MAXN*16);
  for(var i=0;i<MAXN;i++){
    var ox=((i%S)/(S-1)-0.5)*2, oy=(Math.floor(i/S)/(S-1)-0.5)*2;
    var sc=1.8/S;
    inst[i*16]=sc;inst[i*16+1]=0;inst[i*16+2]=0;inst[i*16+3]=ox;
    inst[i*16+4]=0;inst[i*16+5]=sc;inst[i*16+6]=0;inst[i*16+7]=oy;
    inst[i*16+8]=0;inst[i*16+9]=0;inst[i*16+10]=1;inst[i*16+11]=0;
    inst[i*16+12]=0;inst[i*16+13]=0;inst[i*16+14]=0;inst[i*16+15]=1;
  }
  var quad=new Float32Array([-0.5,-0.5,0.5,-0.5,0.5,0.5,-0.5,-0.5,0.5,0.5,-0.5,0.5]);
  // FBO
  var fbo=gl.createFramebuffer(); var tex=gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D,tex);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1024,1024,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
  gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,tex,0);
  gl.viewport(0,0,1024,1024);
  // state
  var bq=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,bq); gl.bufferData(gl.ARRAY_BUFFER,quad,gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
  var bi=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,bi); gl.bufferData(gl.ARRAY_BUFFER,inst,gl.STATIC_DRAW);
  var extI=gl.getExtension('ANGLE_instanced_arrays');
  var divisorFn = is2 ? function(l,v){ gl.vertexAttribDivisor(l,v); } : function(l,v){ extI.vertexAttribDivisorANGLE(l,v); };
  for(var cc=0;cc<4;cc++){ var loc=1+cc; gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,4,gl.FLOAT,false,64,cc*16); divisorFn(loc,1); }
  function countNonBg(){
    var px=new Uint8Array(1024*1024*4);
    gl.readPixels(0,0,1024,1024,gl.RGBA,gl.UNSIGNED_BYTE,px);
    var n=0;
    for(var i=0;i<px.length;i+=4){ if(px[i]>10&&px[i+1]>10&&px[i+2]>10) n++; }
    return n;
  }
  function benchInst(N,iter){
    gl.useProgram(pI);
    gl.clear(gl.COLOR_BUFFER_BIT);
    for(var k=0;k<iter;k++){ if(is2) gl.drawArraysInstanced(gl.TRIANGLES,0,6,N); else extI.drawArraysInstancedANGLE(gl.TRIANGLES,0,6,N); }
    gl.finish();
    var t0=performance.now();
    for(var k2=0;k2<iter;k2++){ if(is2) gl.drawArraysInstanced(gl.TRIANGLES,0,6,N); else extI.drawArraysInstancedANGLE(gl.TRIANGLES,0,6,N); }
    gl.finish();
    var ms=(performance.now()-t0)/iter;
    var px=countNonBg();
    return {ms:ms,px:px};
  }
  function benchObj(N,iter){
    gl.useProgram(pO);
    gl.clear(gl.COLOR_BUFFER_BIT);
    for(var k=0;k<iter;k++){ for(var i=0;i<N;i++){ gl.uniformMatrix4fv(worldO,false,inst.subarray(i*16,i*16+16)); gl.drawArrays(gl.TRIANGLES,0,6); } }
    gl.finish();
    var t0=performance.now();
    for(var k2=0;k2<iter;k2++){ for(var i=0;i<N;i++){ gl.uniformMatrix4fv(worldO,false,inst.subarray(i*16,i*16+16)); gl.drawArrays(gl.TRIANGLES,0,6); } }
    gl.finish();
    var ms=(performance.now()-t0)/iter;
    var px=countNonBg();
    return {ms:ms,px:px};
  }
  var r={};
  try{ r.inst1000=benchInst(1000,30); }catch(e){ r.inst1000={ms:-1,px:-1,err:e}; }
  try{ r.obj1000=benchObj(1000,10); }catch(e){ r.obj1000={ms:-1,px:-1,err:e}; }
  try{ r.inst5000=benchInst(5000,30); }catch(e){ r.inst5000={ms:-1,px:-1,err:e}; }
  function f(r){ return (r.ms<0)?('err:'+r.err):(r.ms.toFixed(2)+'ms/px'+r.px); }
  out.push('INST1000='+f(r.inst1000));
  out.push('OBJ1000='+f(r.obj1000));
  out.push('INST5000='+f(r.inst5000));
  document.title='benchx| '+out.join(' | ');
  try{ console.log('BENCHX '+out.join(' | ')); }catch(e){}
}
</script>
</body></html>
