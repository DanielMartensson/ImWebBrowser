<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>gl2tri</title></head>
<body><canvas id="c" width="256" height="256" style="position:absolute;left:0;top:0"></canvas>
<script>
var out=[];
var c=document.getElementById('c');
var mode = location.hash || '#gl2';
function report(){ document.title='R|'+out.join(' | '); }
var gl=null;
try{
  if(mode=='#gl2') gl=c.getContext('webgl2',{failIfMajorPerformanceCaveat:false,antialias:false});
  else gl=c.getContext('webgl',{failIfMajorPerformanceCaveat:false,antialias:false});
}catch(e){ out.push('ctxErr='+e.message); report(); throw e; }
if(!gl){ out.push('noctx'); report(); }
else{
  var is2 = mode=='#gl2';
  var vs = (is2?
    '#version 300 es\nlayout(location=0) in vec2 a; layout(location=1) in vec3 c; out vec3 vc; void main(){ vc=c; gl_Position=vec4(a,0.0,1.0); }':
    'attribute vec2 a; attribute vec3 c; varying vec3 vc; void main(){ vc=c; gl_Position=vec4(a,0.0,1.0); }');
  var fs = (is2?
    '#version 300 es\nprecision mediump float; in vec3 vc; out vec4 o; void main(){ o=vec4(vc,1.0); }':
    'precision mediump float; varying vec3 vc; void main(){ gl_FragColor=vec4(vc,1.0); }');
  function mk(t,s){
    var sh=gl.createShader(t); gl.shaderSource(sh,s); gl.compileShader(sh);
    if(!gl.getShaderParameter(sh,gl.COMPILE_STATUS)) throw new Error('shader:'+gl.getShaderInfoLog(sh));
    return sh;
  }
  try{
    var p=gl.createProgram();
    gl.attachShader(p,mk(gl.VERTEX_SHADER,vs));
    gl.attachShader(p,mk(gl.FRAGMENT_SHADER,fs));
    gl.linkProgram(p);
    if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error('link:'+gl.getProgramInfoLog(p));
    gl.useProgram(p);
    var buf=gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([
      -0.8,-0.8, 1,0,0,    0.8,-0.8, 0,1,0,    0.0,0.8, 0,0,1
    ]),gl.STATIC_DRAW);
    var stride=5*4, off=2*4;
    var locA=gl.getAttribLocation(p,'a');
    var locC=gl.getAttribLocation(p,'c');
    gl.enableVertexAttribArray(locA);
    gl.vertexAttribPointer(locA,2,gl.FLOAT,false,stride,0);
    gl.enableVertexAttribArray(locC);
    gl.vertexAttribPointer(locC,3,gl.FLOAT,false,stride,off);
    gl.clearColor(0.1,0.1,0.1,1.0);
    gl.clear(gl.COLOR_BUFFER_BIT);
    gl.drawArrays(gl.TRIANGLES,0,3);
    var e=gl.getError();
    out.push('drawErr='+e);
    out.push('fb='+gl.checkFramebufferStatus(gl.FRAMEBUFFER));
    var px=new Uint8Array(4);
    gl.readPixels(128,128,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
    out.push('center='+px[0]+','+px[1]+','+px[2]+','+px[3]);
    gl.readPixels(128,10,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
    out.push('bottom='+px[0]+','+px[1]+','+px[2]+','+px[3]);
    gl.readPixels(10,128,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
    out.push('left='+px[0]+','+px[1]+','+px[2]+','+px[3]);
  }catch(err){ out.push('EX:'+err.message); }
}
report();
try{ console.log('RES '+out.join(' | ')); }catch(e){}
</script>
</body></html>
