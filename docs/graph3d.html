#include "application/application.h"

#include <cstdio>

#include <imgui.h>

namespace imwb {

namespace {

constexpr Uint32 kBackendWindowFlags =
#if defined(IMWEBBROWSER_BACKEND_VULKAN)
    SDL_WINDOW_VULKAN;
#else
    SDL_WINDOW_OPENGL;
#endif

Renderer* create_renderer()
{
#if defined(IMWEBBROWSER_BACKEND_VULKAN)
    return new VulkanRenderer();
#else
    return new GlRenderer();
#endif
}

/* Propagate the system's X11 keyboard layout to libxkbcommon so WPE's XKB
 * context uses the same keymap as the desktop. libxkbcommon reads RMLVO from
 * the XKB_DEFAULT_* env vars (or falls back to "us"); under X11 those are
 * usually unset, so we query \`setxkbmap -query\` and set them ourselves. */
void propagate_xkb_layout()
{
    if (std::getenv("XKB_DEFAULT_LAYOUT"))
        return; /* Respect an explicit override. */

    FILE* pipe = popen("setxkbmap -query 2>/dev/null", "r");
    if (!pipe)
        return;

    char line[256];
    while (std::fgets(line, sizeof(line), pipe)) {
        char* colon = std::strchr(line, ':');
        if (!colon)
            continue;
        *colon = '\\0';
        char* val = colon + 1;
        while (*val == ' ' || *val == '\\t')
            ++val;
        /* Strip trailing whitespace / newline. */
        size_t len = std::strlen(val);
        while (len > 0 && (val[len - 1] == '\\n' || val[len - 1] == ' ' || val[len - 1] == '\\t'))
            val[--len] = '\\0';
        if (len == 0)
            continue;

        if (std::strcmp(line, "rules") == 0)
            setenv("XKB_DEFAULT_RULES", val, 1);
        else if (std::strcmp(line, "model") == 0)
            setenv("XKB_DEFAULT_MODEL", val, 1);
        else if (std::strcmp(line, "layout") == 0)
            setenv("XKB_DEFAULT_LAYOUT", val, 1);
        else if (std::strcmp(line, "variant") == 0)
            setenv("XKB_DEFAULT_VARIANT", val, 1);
        else if (std::strcmp(line, "options") == 0)
            setenv("XKB_DEFAULT_OPTIONS", val, 1);
    }
    pclose(pipe);

    LOG_INFO("XKB layout: %s (variant %s, model %s, rules %s)",
             std::getenv("XKB_DEFAULT_LAYOUT") ? std::getenv("XKB_DEFAULT_LAYOUT") : "?",
             std::getenv("XKB_DEFAULT_VARIANT") ? std::getenv("XKB_DEFAULT_VARIANT") : "",
             std::getenv("XKB_DEFAULT_MODEL") ? std::getenv("XKB_DEFAULT_MODEL") : "?",
             std::getenv("XKB_DEFAULT_RULES") ? std::getenv("XKB_DEFAULT_RULES") : "?");
}

} /* namespace */

bool Application::initialize(const Config& config)
{
    m_config = config;

    propagate_xkb_layout();

    if (!SDL_Init(SDL_INIT_VIDEO)) {
        LOG_ERROR("SDL_Init failed: %s", SDL_GetError());
        return false;
    }

    if (!m_window.initialize(config, kBackendWindowFlags)) {
        LOG_ERROR("Window initialization failed");
        return false;
    }

    /* ImGui context + style. */
    IMGUI_CHECKVERSION();
    ImGui::CreateContext();
    ImGui::StyleColorsDark();
    ImGui::GetIO().IniFilename = nullptr;

    m_renderer = create_renderer();
    if (!m_renderer->initialize(m_window)) {
        LOG_ERROR("Renderer initialization failed");
        return false;
    }

    /* Browser (WPE) on top of the renderer's sink + EGL display. */
    if (!m_browser.initialize(config, m_renderer->egl_display_for_wpe(),
                              m_renderer->frame_sink())) {
        LOG_ERROR("Browser initialization failed");
        return false;
    }

    /* Route input into the web view. */
    m_input.set_view_backend(m_browser.page().view_backend());
    m_input.set_view_geometry(0, 0, config.window_width, config.window_height, 1.0f);
    m_input.set_smooth_scrolling(config.smooth_scrolling);
    m_input.initialize_xkb();

    m_browser.page().load_uri(config.startup_url.empty() ? "about:blank" : config.startup_url);

    m_running = true;
    LOG_INFO("ImWebBrowser %s started", IMWEBBROWSER_VERSION);
    return true;
}

void Application::shutdown()
{
    m_input.set_view_backend(nullptr);

    m_browser.shutdown();

    if (m_renderer) {
        m_renderer->shutdown();
        delete m_renderer;
        m_renderer = nullptr;
    }

    ImGui::DestroyContext();
    m_window.shutdown();
    SDL_Quit();
    LOG_INFO("ImWebBrowser exited");
}

bool Application::handle_shortcuts(const SDL_Event& event)
{
    if (event.type != SDL_EVENT_KEY_DOWN || event.key.repeat)
        return false;

    const bool ctrl = (event.key.mod & SDL_KMOD_CTRL) != 0;
    const bool alt = (event.key.mod & SDL_KMOD_ALT) != 0;

    if (ctrl && event.key.scancode == SDL_SCANCODE_L) {
        m_ui.focus_address_bar();
    } else if (ctrl && event.key.scancode == SDL_SCANCODE_R) {
        m_browser.page().reload();
    } else if (!ctrl && !alt && event.key.scancode == SDL_SCANCODE_F5) {
        m_browser.page().reload();
    } else if (alt && event.key.scancode == SDL_SCANCODE_LEFT) {
        m_browser.page().go_back();
    } else if (alt && event.key.scancode == SDL_SCANCODE_RIGHT) {
        m_browser.page().go_forward();
    } else if (event.key.scancode == SDL_SCANCODE_F11) {
        toggle_kiosk();
        return true;
    } else if (m_kiosk && event.key.scancode == SDL_SCANCODE_ESCAPE) {
        exit_kiosk();
        return true;
    }
    return false;
}

void Application::enter_kiosk()
{
    if (m_kiosk)
        return;
    m_kiosk = true;
    m_ui.set_kiosk(true);
    m_window.set_fullscreen(true);
    LOG_INFO("Entered kiosk mode");
}

void Application::exit_kiosk()
{
    if (!m_kiosk)
        return;
    m_kiosk = false;
    m_ui.set_kiosk(false);
    m_window.set_fullscreen(false);
    LOG_INFO("Exited kiosk mode");
}

void Application::toggle_kiosk()
{
    if (m_kiosk)
        exit_kiosk();
    else
        enter_kiosk();
}

void Application::handle_event(const SDL_Event& event)
{
    switch (event.type) {
    case SDL_EVENT_QUIT:
    case SDL_EVENT_WINDOW_CLOSE_REQUESTED:
        m_running = false;
        break;
    case SDL_EVENT_WINDOW_RESIZED: {
        int w = 0, h = 0;
        m_window.drawable_size(&w, &h);
        m_renderer->on_resize(w, h);
        break;
    }
    case SDL_EVENT_WINDOW_FOCUS_GAINED:
        m_browser.page().set_activity(true, true, true);
        break;
    case SDL_EVENT_WINDOW_FOCUS_LOST:
        m_browser.page().set_activity(true, false, true);
        break;
    default:
        break;
    }

    /* Keyboard shortcuts first (they also work while the page has focus). */
    const bool shortcut_handled = handle_shortcuts(event);

    /* Forward input to the web view unless a text field owns the keyboard. */
    if (!m_ui.wants_keyboard() && !shortcut_handled)
        m_input.handle_event(event);
}

void Application::update_window_title()
{
    const std::string title = m_browser.page().title();
    if (title.empty())
        return;

    static std::string last_title;
    const std::string full = "ImWebBrowser - " + title;
    if (full != last_title) {
        last_title = full;
        SDL_SetWindowTitle(m_window.sdl_window(), full.c_str());
    }
}

int Application::run(const Config& config)
{
    if (!initialize(config))
        return 1;

    while (m_running) {
        /* SDL events. */
        SDL_Event event;
        while (SDL_PollEvent(&event)) {
            ImGui_ImplSDL3_ProcessEvent(&event);
            handle_event(event);
        }

        /* Begin the ImGui frame (also makes the GL context current). */
        m_renderer->begin_frame();

        /* Service the WPE/GLib main loop: new frames arrive here. */
        m_browser.wpe().pump_main_context();

        /* Build the web view texture handle for the UI. */
        BrowserUi::WebViewTexture texture{};
#if defined(IMWEBBROWSER_BACKEND_VULKAN)
        auto* vk_renderer = static_cast<VulkanRenderer*>(m_renderer);
        texture.valid = vk_renderer->frame_ready();
        texture.handle = reinterpret_cast<uint64_t>(vk_renderer->webview_texture());
        texture.width = vk_renderer->frame_width();
        texture.height = vk_renderer->frame_height();
#else
        auto* gl_renderer = static_cast<GlRenderer*>(m_renderer);
        texture.valid = gl_renderer->frame_ready();
        texture.handle = static_cast<uint64_t>(gl_renderer->webview_texture());
        texture.width = gl_renderer->frame_width();
        texture.height = gl_renderer->frame_height();
#endif

        /* UI: toolbar + web view, and report the viewport back to WPE. */
        m_ui.draw(m_browser, texture);

        if (m_ui.consume_kiosk_request())
            enter_kiosk();

        const WebViewViewport& viewport = m_browser.viewport();
        m_input.set_view_geometry(viewport.x, viewport.y, viewport.width, viewport.height,
                                  viewport.scale);

        update_window_title();

        /* Present the frame. */
        m_renderer->render_present();

        if (m_window.minimized())
            SDL_Delay(16);
    }

    shutdown();
    return 0;
}

} /* namespace imwb */

namespace imwb {

bool Browser::initialize(const Config& config, void* egl_display, FrameSink& sink)
{
    m_config = config;

    if (!m_wpe.initialize(egl_display)) {
        LOG_ERROR("Browser: WPE initialization failed");
        return false;
    }

    /* Initial viewport: full window in physical pixels. */
    const uint32_t initial_w = static_cast<uint32_t>(config.window_width);
    const uint32_t initial_h = static_cast<uint32_t>(config.window_height);

    if (!m_page.create(sink, initial_w, initial_h, config)) {
        LOG_ERROR("Browser: web page creation failed");
        return false;
    }

    return true;
}

void Browser::shutdown()
{
    m_page.destroy();
    m_wpe.shutdown();
}

void Browser::set_viewport(const WebViewViewport& viewport)
{
    m_viewport = viewport;

    const uint32_t w = static_cast<uint32_t>(viewport.width * viewport.scale);
    const uint32_t h = static_cast<uint32_t>(viewport.height * viewport.scale);
    if (w == 0 || h == 0)
        return;

    m_page.resize(w, h, viewport.scale);
}

} /* namespace imwb */

bool parse_bool(const std::string& value)
{
    return value == "1" || value == "true" || value == "yes" || value == "on";
}

} /* namespace */

Config Config::from_command_line(int argc, char** argv, bool* ok)
{
    Config c = defaults();
    *ok = true;

    auto need_value = [&](int i, const std::string& flag) -> const char* {
        if (i + 1 >= argc) {
            LOG_ERROR("option %s requires a value", flag.c_str());
            *ok = false;
            return nullptr;
        }
        return argv[i + 1];
    };

    for (int i = 1; i < argc; ++i) {
        const std::string arg = argv[i];

        if (arg == "--help" || arg == "-h") {
            *ok = false;
            return c;
        } else if (arg == "--fullscreen") {
            c.fullscreen = true;
        } else if (arg.rfind("--url=", 0) == 0) {
            c.startup_url = arg.substr(6);
        } else if (arg == "--url" || arg == "-u") {

#include "input/input_translator.h"

#include <wpe/wpe.h>

#include "input/keymap.h"
#include "logging/log.h"

namespace imwb {

namespace {

constexpr uint32_t kAxisVertical = 0;
constexpr uint32_t kAxisHorizontal = 1;

constexpr uint32_t kWpeModControl = 1u << 0;
constexpr uint32_t kWpeModShift = 1u << 1;
constexpr uint32_t kWpeModAlt = 1u << 2;
constexpr uint32_t kWpeModMeta = 1u << 3;

constexpr uint32_t kWpeBtnLeft = 1u << 20;
constexpr uint32_t kWpeBtnRight = 1u << 21;
constexpr uint32_t kWpeBtnMiddle = 1u << 22;

/* SDL3 mouse buttons: 1=left, 2=middle, 3=right, 4/5=x1/x2.
 * WPE expects: 1=left, 2=right, 3=middle, 4=back, 5=forward. */
uint32_t wpe_button_from_sdl(uint8_t sdl_button)
{
    switch (sdl_button) {
    case SDL_BUTTON_LEFT: return 1;
    case SDL_BUTTON_RIGHT: return 3;
    case SDL_BUTTON_MIDDLE: return 2;
    case SDL_BUTTON_X1: return 4;
    case SDL_BUTTON_X2: return 5;
    default: return 0;
    }
}

uint32_t wpe_button_bit_from_sdl(uint8_t sdl_button)
{
    switch (sdl_button) {
    case SDL_BUTTON_LEFT: return kWpeBtnLeft;
    case SDL_BUTTON_RIGHT: return kWpeBtnRight;
    case SDL_BUTTON_MIDDLE: return kWpeBtnMiddle;
    default: return 0;
    }
}

} /* namespace */

uint32_t InputTranslator::wpe_modifiers_from_sdl(uint16_t sdl_mods) const
{
    uint32_t mods = 0;
    if (sdl_mods & SDL_KMOD_CTRL) mods |= kWpeModControl;
    if (sdl_mods & SDL_KMOD_SHIFT) mods |= kWpeModShift;
    if (sdl_mods & SDL_KMOD_ALT) mods |= kWpeModAlt;
    if (sdl_mods & SDL_KMOD_GUI) mods |= kWpeModMeta;
    return mods;
}

bool InputTranslator::pointer_in_view(float x, float y) const
{
    return x >= static_cast<float>(m_view_x) &&
           y >= static_cast<float>(m_view_y) &&
           x < static_cast<float>(m_view_x + m_view_width) &&
           y < static_cast<float>(m_view_y + m_view_height);
}

void InputTranslator::view_pixel_from_logical(float x, float y, int* px, int* py) const
{
    int local_x = static_cast<int>((x - static_cast<float>(m_view_x)) * m_scale);
    int local_y = static_cast<int>((y - static_cast<float>(m_view_y)) * m_scale);
    if (local_x < 0) local_x = 0;
    if (local_y < 0) local_y = 0;
    if (px) *px = local_x;
    if (py) *py = local_y;
}

void InputTranslator::dispatch_keyboard(SDL_Scancode scancode, uint16_t sdl_mods,
                                        bool pressed, bool repeat)
{
    if (!m_backend)
        return;

    const uint32_t hardware_key_code = keymap_evdev_from_scancode(scancode);
    if (hardware_key_code == 0)
        return;

    /* Use our own XKB keymap (system layout) instead of libwpe's hardcoded
     * "us" layout. This returns the keysym matching the desktop layout. */
    const uint32_t key_code = m_xkb.keysym_for_keycode(hardware_key_code, pressed);

    /* If compose handling produced a fallback keysym (dead key's own
     * character after a failed compose), dispatch it before the current key. */
    if (pressed) {
        uint32_t fallback = m_xkb.consume_pending_fallback();
        if (fallback) {
            struct wpe_input_keyboard_event fb{};
            fb.time = SDL_GetTicks();
            fb.key_code = fallback;
            fb.hardware_key_code = hardware_key_code;
            fb.pressed = true;
            fb.modifiers = wpe_modifiers_from_sdl(sdl_mods);
            wpe_view_backend_dispatch_keyboard_event(m_backend, &fb);
            fb.pressed = false;
            wpe_view_backend_dispatch_keyboard_event(m_backend, &fb);
        }
    }

    if (key_code == 0)
        return;

    struct wpe_input_keyboard_event event{};
    event.time = SDL_GetTicks();
    event.key_code = key_code;
    event.hardware_key_code = hardware_key_code;
    event.pressed = pressed || repeat;
    event.modifiers = wpe_modifiers_from_sdl(sdl_mods);

    wpe_view_backend_dispatch_keyboard_event(m_backend, &event);
}

void InputTranslator::dispatch_pointer_motion(float x, float y, uint16_t sdl_mods)
{
    if (!m_backend)
        return;

    int px = 0, py = 0;
    if (!pointer_in_view(x, y))
        return;
    view_pixel_from_logical(x, y, &px, &py);

    struct wpe_input_pointer_event event{};
    event.type = wpe_input_pointer_event_type_motion;
    event.time = SDL_GetTicks();
    event.x = px;
    event.y = py;
    event.button = 0;
    event.state = m_pressed_buttons;
    event.modifiers = wpe_modifiers_from_sdl(sdl_mods);
    wpe_view_backend_dispatch_pointer_event(m_backend, &event);
}

void InputTranslator::dispatch_pointer_button(float x, float y, uint8_t button,
                                              bool pressed, uint16_t sdl_mods)
{
    if (!m_backend)
        return;

    int px = 0, py = 0;
    if (!pointer_in_view(x, y))
        return;
    view_pixel_from_logical(x, y, &px, &py);

    const uint32_t wpe_button = wpe_button_from_sdl(button);
    const uint32_t button_bit = wpe_button_bit_from_sdl(button);

    if (pressed)
        m_pressed_buttons |= button_bit;
    else
        m_pressed_buttons &= ~button_bit;

    struct wpe_input_pointer_event event{};
    event.type = wpe_input_pointer_event_type_button;
    event.time = SDL_GetTicks();
    event.x = px;
    event.y = py;
    event.button = wpe_button;
    event.state = m_pressed_buttons;
    event.modifiers = wpe_modifiers_from_sdl(sdl_mods);
    wpe_view_backend_dispatch_pointer_event(m_backend, &event);
}

void InputTranslator::dispatch_axis(float x, float y, float wheel_y, uint16_t sdl_mods)
{
    if (!m_backend || wheel_y == 0.0f)
        return;

    int px = 0, py = 0;
    if (!pointer_in_view(x, y))
        return;
    view_pixel_from_logical(x, y, &px, &py);

    /* SDL: positive wheel_y scrolls away from the user (up). WPE treats a
     * positive axis value the same way. */
    int32_t value = 0;
    if (m_smooth_scrolling)
        value = static_cast<int32_t>(wheel_y * 40.0f); /* pixel units */
    else
        value = static_cast<int32_t>(wheel_y);         /* line units */

    struct wpe_input_axis_event event{};
    event.type = m_smooth_scrolling ? wpe_input_axis_event_type_motion_smooth
                                    : wpe_input_axis_event_type_motion;
    event.time = SDL_GetTicks();
    event.x = px;
    event.y = py;
    event.axis = kAxisVertical;
    event.value = value;
    event.modifiers = wpe_modifiers_from_sdl(sdl_mods);
    wpe_view_backend_dispatch_axis_event(m_backend, &event);
}

bool InputTranslator::handle_event(const SDL_Event& event)
{
    switch (event.type) {
    case SDL_EVENT_KEY_DOWN: {
        dispatch_keyboard(event.key.scancode, event.key.mod, true, event.key.repeat);
        return true;
    }
    case SDL_EVENT_KEY_UP: {
        dispatch_keyboard(event.key.scancode, event.key.mod, false, false);
        return true;
    }
    case SDL_EVENT_MOUSE_MOTION: {
        dispatch_pointer_motion(event.motion.x, event.motion.y, SDL_GetModState());
        return true;
    }
    case SDL_EVENT_MOUSE_BUTTON_DOWN: {
        dispatch_pointer_button(event.button.x, event.button.y, event.button.button, true,
                                SDL_GetModState());
        return true;
    }
    case SDL_EVENT_MOUSE_BUTTON_UP: {
        dispatch_pointer_button(event.button.x, event.button.y, event.button.button, false,
                                SDL_GetModState());
        return true;
    }
    case SDL_EVENT_MOUSE_WHEEL: {
        dispatch_axis(event.wheel.mouse_x, event.wheel.mouse_y, event.wheel.y, SDL_GetModState());
        return true;
    }
    default:
        return false;
    }
}

/* Linux evdev <-> XKB keycode offset. libwpe's
 * wpe_input_xkb_context_get_key_code() consumes the *XKB* keycode, which is
 * the evdev keycode plus 8 — that is the same convention the X.org server and
 * Wayland compositors use to key xkb_state. Returning the raw evdev code
 * here shifts every key by 8 (e.g. BackSpace (evdev 14 = XKB "5") yields the
 * digit 5), so the +8 is applied before handing the code to WPE. */
constexpr uint32_t kXkbKeycodeOffset = 8;

uint32_t keymap_evdev_from_scancode(SDL_Scancode scancode)
{
    if (scancode < 0 || scancode >= static_cast<int>(kScancodeToEvdev.size()))

    return kScancodeToEvdev[static_cast<std::size_t>(scancode)] + kXkbKeycodeOffset;

/* Reads the system XKB RMLVO from XKB_DEFAULT_* env vars, or from
 * \`setxkbmap -query\` if the env vars are unset (typical under X11). */
void load_system_rmlvo(xkb_rule_names& names)
{
    /* Start with everything NULL so xkb_keymap_new_from_names reads the
     * XKB_DEFAULT_* env vars. */
    names = {};

    /* If XKB_DEFAULT_LAYOUT is already set, xkb_keymap_new_from_names will
     * pick up all the XKB_DEFAULT_* vars automatically — just return. */
    if (std::getenv("XKB_DEFAULT_LAYOUT"))
        return;

    /* Under X11 the env vars are usually unset; query setxkbmap instead. */
    FILE* pipe = popen("setxkbmap -query 2>/dev/null", "r");
    if (!pipe) {
        LOG_WARN("XKB: setxkbmap query failed; using libxkbcommon defaults");
        return;
    }

    char line[256];
    while (std::fgets(line, sizeof(line), pipe)) {
        char* colon = std::strchr(line, ':');
        if (!colon)
            continue;
        *colon = '\\0';
        char* val = colon + 1;
        while (*val == ' ' || *val == '\\t')
            ++val;
        size_t len = std::strlen(val);

            val[--len] = '\\0';
        if (len == 0)
            continue;

        /* These are static-duration strings that persist for the process
         * lifetime; the xkb_rule_names struct just holds the pointers. */
        static char s_rules[64] = "evdev";
        static char s_model[64] = "pc105";
        static char s_layout[64] = {};
        static char s_variant[64] = {};
        static char s_options[128] = {};

        if (std::strcmp(line, "rules") == 0)
            std::snprintf(s_rules, sizeof(s_rules), "%s", val), names.rules = s_rules;
        else if (std::strcmp(line, "model") == 0)
            std::snprintf(s_model, sizeof(s_model), "%s", val), names.model = s_model;
        else if (std::strcmp(line, "layout") == 0)
            std::snprintf(s_layout, sizeof(s_layout), "%s", val), names.layout = s_layout;
        else if (std::strcmp(line, "variant") == 0)
            std::snprintf(s_variant, sizeof(s_variant), "%s", val), names.variant = s_variant;
        else if (std::strcmp(line, "options") == 0)
            std::snprintf(s_options, sizeof(s_options), "%s", val), names.options = s_options;
    }
    pclose(pipe);
}

XkbLayout::~XkbLayout()
{
    if (m_compose_state)
        xkb_compose_state_unref(static_cast<struct xkb_compose_state*>(m_compose_state));
    if (m_compose_table)
        xkb_compose_table_unref(static_cast<struct xkb_compose_table*>(m_compose_table));
    if (m_state)
        xkb_state_unref(static_cast<struct xkb_state*>(m_state));
    if (m_keymap)
        xkb_keymap_unref(static_cast<struct xkb_keymap*>(m_keymap));
    if (m_context)
        xkb_context_unref(static_cast<struct xkb_context*>(m_context));
}

bool XkbLayout::initialize()
{
    auto* ctx = xkb_context_new(XKB_CONTEXT_NO_FLAGS);
    if (!ctx) {
        LOG_ERROR("XKB: failed to create xkb_context");
        return false;
    }
    m_context = ctx;

    xkb_rule_names names;
    load_system_rmlvo(names);

    auto* keymap = xkb_keymap_new_from_names(ctx, &names, XKB_KEYMAP_COMPILE_NO_FLAGS);
    if (!keymap) {
        keymap = xkb_keymap_new_from_names(ctx, nullptr, XKB_KEYMAP_COMPILE_NO_FLAGS);
    }
    if (!keymap) {
        LOG_ERROR("XKB: failed to create xkb_keymap");
        return false;
    }
    m_keymap = keymap;

    auto* state = xkb_state_new(keymap);
    if (!state) {
        LOG_ERROR("XKB: failed to create xkb_state");
        return false;
    }
    m_state = state;

    /* Create compose table from locale for dead key support (e.g. Swedish). */
    const char* locale = std::getenv("LC_ALL");
    if (!locale || !*locale)
        locale = std::getenv("LC_CTYPE");
    if (!locale || !*locale)
        locale = std::getenv("LANG");
    if (!locale || !*locale)
        locale = "C";
    auto* compose_table = xkb_compose_table_new_from_locale(ctx, locale, XKB_COMPOSE_COMPILE_NO_FLAGS);
    if (compose_table) {
        m_compose_table = compose_table;
        auto* compose_state = xkb_compose_state_new(compose_table, XKB_COMPOSE_STATE_NO_FLAGS);
        if (compose_state)
            m_compose_state = compose_state;
        LOG_INFO("XKB: compose table loaded for dead key support");
    } else {
        LOG_WARN("XKB: no compose table available (dead keys disabled)");
    }

    LOG_INFO("XKB: keymap loaded (layout %s)",
             names.layout ? names.layout :
             (std::getenv("XKB_DEFAULT_LAYOUT") ? std::getenv("XKB_DEFAULT_LAYOUT") : "us"));
    return true;
}

uint32_t XkbLayout::keysym_for_keycode(uint32_t keycode, bool pressed)
{
    auto* state = static_cast<struct xkb_state*>(m_state);
    if (!state)
        return 0;

    if (pressed)
        xkb_state_update_key(state, keycode, XKB_KEY_DOWN);
    else
        xkb_state_update_key(state, keycode, XKB_KEY_UP);

    const xkb_keysym_t* syms = nullptr;
    int count = xkb_state_key_get_syms(state, keycode, &syms);
    uint32_t raw_keysym = (count > 0) ? syms[0] : 0;

    /* Feed through compose state for dead key support (key-down only). */
    auto* compose = static_cast<struct xkb_compose_state*>(m_compose_state);
    if (!compose || !pressed)
        return raw_keysym;

    xkb_compose_state_feed(compose, raw_keysym);

    switch (xkb_compose_state_get_status(compose)) {
    case XKB_COMPOSE_COMPOSING:
        /* Dead key pressed — remember its own keysym for fallback,
         * suppress the event (return 0) while we wait for the next key. */
        m_pending_fallback = raw_keysym;
        return 0;

    case XKB_COMPOSE_COMPOSED: {
        /* Compose sequence completed (e.g. ¨+a -> å). */
        uint32_t composed = xkb_compose_state_get_one_sym(compose);
        m_pending_fallback = 0;
        return composed ? composed : raw_keysym;
    }

    case XKB_COMPOSE_CANCELLED: {
        /* Dead key followed by a non-composing key. Emit the dead key's
         * own character first (via pending fallback), then this key. */
        return raw_keysym;
    }

    default: /* XKB_COMPOSE_NOTHING */
        m_pending_fallback = 0;
        return raw_keysym;
    }
}

uint32_t XkbLayout::consume_pending_fallback()
{
    uint32_t sym = m_pending_fallback;
    m_pending_fallback = 0;
    return sym;
}

#include <cstdio>
#include <ctime>
#include <atomic>
#include <mutex>

namespace imwb {

namespace {

std::atomic<LogLevel> g_level{LogLevel::Info};
std::mutex g_mutex;

const char* level_name(LogLevel level)
{
    switch (level) {
    case LogLevel::Trace: return "trace";
    case LogLevel::Debug: return "debug";
    case LogLevel::Info: return "info";
    case LogLevel::Warn: return "warn";
    case LogLevel::Error: return "error";
    }
    return "?";
}

} /* namespace */

void log_set_level(LogLevel level)
{
    g_level.store(level);
}

LogLevel log_get_level()
{
    return g_level.load();
}

void log_write(LogLevel level, const char* file, int line, const char* fmt, ...)
{
    if (static_cast<int>(level) < static_cast<int>(g_level.load()))
        return;

    char time_buf[32] = {0};
    std::time_t now = std::time(nullptr);
    std::tm tm_buf;
    if (localtime_r(&now, &tm_buf))
        std::strftime(time_buf, sizeof(time_buf), "%H:%M:%S", &tm_buf);

    std::lock_guard<std::mutex> lock(g_mutex);

    std::fprintf(stderr, "[%s] %-5s %s:%d: ", time_buf, level_name(level), file, line);

    va_list args;
    va_start(args, fmt);
    std::vfprintf(stderr, fmt, args);
    va_end(args);

    std::fprintf(stderr, "\\n");
    std::fflush(stderr);
}

void format_for_internal(GLenum internal_format, GLenum* format, GLenum* type)

    case GL_RGB565:

bool GlRenderer::initialize(Window& window)
{
    m_window = &window;

    SDL_GL_SetAttribute(SDL_GL_CONTEXT_MAJOR_VERSION, 3);
    SDL_GL_SetAttribute(SDL_GL_CONTEXT_MINOR_VERSION, 2);
    SDL_GL_SetAttribute(SDL_GL_CONTEXT_PROFILE_MASK, SDL_GL_CONTEXT_PROFILE_ES);

    m_gl_context = SDL_GL_CreateContext(window.sdl_window());
    if (!m_gl_context) {
        LOG_ERROR("GL: SDL_GL_CreateContext failed: %s", SDL_GetError());
        return false;
    }
    if (!SDL_GL_MakeCurrent(window.sdl_window(), m_gl_context)) {
        LOG_ERROR("GL: SDL_GL_MakeCurrent failed: %s", SDL_GetError());
        return false;
    }
    int swap_interval = 0;
    const char* env = SDL_getenv("IMWB_SWAP_INTERVAL");
    if (env && *env)
        swap_interval = SDL_atoi(env);
    SDL_GL_SetSwapInterval(swap_interval);
    LOG_INFO("GL: swap interval %d", swap_interval);

    LOG_INFO("GL: renderer %s, version %s", (const char*)glGetString(GL_RENDERER),
             (const char*)glGetString(GL_VERSION));

    g_egl_image_target_texture_2d = reinterpret_cast<PFNGLEGLIMAGETARGETTEXTURE2DOESPROC>(
        eglGetProcAddress("glEGLImageTargetTexture2DOES"));
    if (!g_egl_image_target_texture_2d) {
        LOG_ERROR("GL: glEGLImageTargetTexture2DOES not available");
        return false;
    }

    /* The EGL display shared with WPE. */
    m_egl_display = eglGetCurrentDisplay();
    if (m_egl_display == EGL_NO_DISPLAY) {
        /* Fallback: create an EGL display ourselves. Mesa returns the same
         * display object for the same native display, so WPE images made on
         * it remain usable by SDL's context. */
        m_egl_display = eglGetDisplay(EGL_DEFAULT_DISPLAY);
        EGLint major = 0, minor = 0;
        if (m_egl_display == EGL_NO_DISPLAY ||
            !eglInitialize(m_egl_display, &major, &minor)) {
            LOG_ERROR("GL: no EGL display is current and none could be created");
            return false;
        }
        eglBindAPI(EGL_OPENGL_ES_API);
        LOG_INFO("GL: created EGL display %p (EGL %d.%d)",
                 (void*)m_egl_display, major, minor);
    }

    /* Scratch texture that EGL images are bound into. */
    glGenTextures(1, &m_scratch_texture);

    /* FBOs for the glBlitFramebuffer copy (GLES 3.0+). */
    glGenFramebuffers(1, &m_scratch_fbo);
    glGenFramebuffers(1, &m_webview_fbo);

    if (!ImGui_ImplOpenGL3_Init("#version 300 es")) {
        LOG_ERROR("GL: ImGui_ImplOpenGL3_Init failed");
        return false;
    }
    if (!ImGui_ImplSDL3_InitForOpenGL(window.sdl_window(), m_gl_context)) {
        LOG_ERROR("GL: ImGui_ImplSDL3_InitForOpenGL failed");
        return false;
    }

    LOG_INFO("GL: renderer initialized (EGL display %p)", (void*)m_egl_display);
    return true;
}

void GlRenderer::shutdown()
{
    if (m_pending_fence) {
        glDeleteSync(m_pending_fence);
        m_pending_fence = nullptr;
    }
    if (m_scratch_fbo) {
        glDeleteFramebuffers(1, &m_scratch_fbo);
        m_scratch_fbo = 0;
    }
    if (m_webview_fbo) {
        glDeleteFramebuffers(1, &m_webview_fbo);
        m_webview_fbo = 0;
    }
    if (m_scratch_texture) {
        glDeleteTextures(1, &m_scratch_texture);
        m_scratch_texture = 0;
    }
    if (m_webview_texture) {
        glDeleteTextures(1, &m_webview_texture);
        m_webview_texture = 0;

    ImGui_ImplSDL3_Shutdown();
    ImGui_ImplOpenGL3_Shutdown();

void GlRenderer::ensure_webview_texture(GLenum internal_format, uint32_t width, uint32_t height)
{
    if (m_webview_texture != 0 && m_webview_width == width &&
        m_webview_height == height && m_webview_internal_format == internal_format)
        return;

    if (m_webview_texture == 0)
        glGenTextures(1, &m_webview_texture);

    glBindTexture(GL_TEXTURE_2D, m_webview_texture);
    glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_LINEAR);
    glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_LINEAR);
    glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_EDGE);
    glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_EDGE);

    GLenum format = GL_RGBA, type = GL_UNSIGNED_BYTE;
    format_for_internal(internal_format, &format, &type);
    glTexImage2D(GL_TEXTURE_2D, 0, internal_format, width, height, 0, format, type, nullptr);

    m_webview_width = width;
    m_webview_height = height;
    m_webview_internal_format = internal_format;
    glBindTexture(GL_TEXTURE_2D, 0);
}

void GlRenderer::on_egl_image(const EglFrame& frame)

     * scratch texture.  Unlike glFinish(), this only waits if the GPU is
     * actually behind; when the fence has already signaled, the call is
     * essentially free. */
    if (m_pending_fence) {
        glClientWaitSync(m_pending_fence, GL_SYNC_FLUSH_COMMANDS_BIT, 0);
        glDeleteSync(m_pending_fence);
        m_pending_fence = nullptr;

    glBindTexture(GL_TEXTURE_2D, m_scratch_texture);
    g_egl_image_target_texture_2d(GL_TEXTURE_2D, reinterpret_cast<GLeglImageOES>(frame.image));

    glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_LINEAR);
    glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_EDGE);
    glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_EDGE);
    glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_BASE_LEVEL, 0);
    glTexParameteri(GL_TEXTURE_2D, GL_TEXTURE_MAX_LEVEL, 0);

    GLint internal_format = GL_RGBA8;
    glGetTexLevelParameteriv(GL_TEXTURE_2D, 0, GL_TEXTURE_INTERNAL_FORMAT, &internal_format);

     * then release the image.  Works on VeriSilicon GC7000 (ES 3.1) unlike
     * glCopyImageSubData which requires ES 3.2. */
    glBindFramebuffer(GL_READ_FRAMEBUFFER, m_scratch_fbo);
    glFramebufferTexture2D(GL_READ_FRAMEBUFFER, GL_COLOR_ATTACHMENT0,
                           GL_TEXTURE_2D, m_scratch_texture, 0);

    glBindFramebuffer(GL_DRAW_FRAMEBUFFER, m_webview_fbo);
    glFramebufferTexture2D(GL_DRAW_FRAMEBUFFER, GL_COLOR_ATTACHMENT0,
                           GL_TEXTURE_2D, m_webview_texture, 0);

    glBlitFramebuffer(0, 0, frame.width, frame.height,
                      0, 0, frame.width, frame.height,
                      GL_COLOR_BUFFER_BIT, GL_NEAREST);

    glBindFramebuffer(GL_FRAMEBUFFER, 0);

    /* Place a fence so we can wait at the start of the *next* frame instead
     * of blocking here.  This lets the exportable callback return to WPE
     * immediately (WPE can start compositing the next frame on the GPU)
     * while the copy is still in flight.  The fence is waited above before
     * we touch the scratch texture again. */
    m_pending_fence = glFenceSync(GL_SYNC_GPU_COMMANDS_COMPLETE, 0);

    m_frame_ready = true;
    m_frame_width = frame.width;
    m_frame_height = frame.height;
}

{
    (void)frame;
    LOG_WARN("GL: unexpected dmabuf frame (sink requested EGL images)");

/* wl_shm_format values for the common BGRA-in-memory pixel formats. */
namespace {
constexpr uint32_t kShmFormatArgb8888 = 0;
constexpr uint32_t kShmFormatXrgb8888 = 1;
} /* namespace */

void GlRenderer::on_shm(const ShmFrame& frame)
{
    if (!frame.data || !frame.width || !frame.height)
        return;

    if (frame.format != kShmFormatArgb8888 && frame.format != kShmFormatXrgb8888) {
        LOG_WARN("GL: unsupported shm frame format 0x%08x", frame.format);
        return;
    }

    ensure_webview_texture(GL_RGBA8, frame.width, frame.height);

    /* wl_shm ARGB8888/XRGB8888 store bytes as B,G,R,A in memory; GL_RGBA
     * upload needs R,G,B,A. Swap on the way through a staging row buffer. */
    const uint8_t* src = static_cast<const uint8_t*>(frame.data);
    const size_t row_bytes = static_cast<size_t>(frame.width) * 4;
    const size_t stride = frame.stride >= row_bytes ? frame.stride : row_bytes;
    std::vector<uint8_t> row(row_bytes);

    glBindTexture(GL_TEXTURE_2D, m_webview_texture);
    for (uint32_t y = 0; y < frame.height; ++y) {
        const uint8_t* line = src + static_cast<size_t>(y) * stride;
        for (uint32_t x = 0; x < frame.width; ++x) {
            const uint8_t* p = line + static_cast<size_t>(x) * 4;
            row[x * 4 + 0] = p[2];
            row[x * 4 + 1] = p[1];
            row[x * 4 + 2] = p[0];
            row[x * 4 + 3] = p[3];
        }
        glPixelStorei(GL_UNPACK_ALIGNMENT, 1);
        glTexSubImage2D(GL_TEXTURE_2D, 0, 0, y, frame.width, 1, GL_RGBA,
                        GL_UNSIGNED_BYTE, row.data());
    }
    glPixelStorei(GL_UNPACK_ALIGNMENT, 4);
    glBindTexture(GL_TEXTURE_2D, 0);

    {
        static bool dumped = false;
        if (!dumped) {
            dumped = true;
            FILE* f = fopen("/tmp/opencode/shmdump.bgra", "wb");
            if (f) {
                for (uint32_t y = 0; y < frame.height; ++y)
                    fwrite(src + static_cast<size_t>(y) * stride, 1, row_bytes, f);
                fclose(f);
            }
            LOG_INFO("GL: dumped first shm frame to /tmp/opencode/shmdump.bgra (%ux%u)",
                     frame.width, frame.height);
        }
    }

    m_frame_ready = true;
    m_frame_width = frame.width;
    m_frame_height = frame.height;
}

void VulkanRenderer::create_descriptor_pool()
{
    VkDescriptorPoolSize pool_sizes[] = {
        {VK_DESCRIPTOR_TYPE_COMBINED_IMAGE_SAMPLER, 32},
        {VK_DESCRIPTOR_TYPE_SAMPLER, 16},
        {VK_DESCRIPTOR_TYPE_SAMPLED_IMAGE, 16},

bool VulkanRenderer::create_swapchain(bool initial)

    ImGui_ImplVulkanH_Window* wd = &m_wd;

    if (wd->Width != 0 && wd->Height != 0 && wd->Swapchain != VK_NULL_HANDLE)
        return true;

    int drawable_w = 0, drawable_h = 0;
    m_window->drawable_size(&drawable_w, &drawable_h);
    if (drawable_w == 0 || drawable_h == 0)
        return false;

    wd->Surface = m_surface;

    const VkFormat request_formats[] = {VK_FORMAT_B8G8R8A8_SRGB, VK_FORMAT_B8G8R8A8_UNORM,
                                        VK_FORMAT_R8G8B8A8_UNORM};
    wd->SurfaceFormat = ImGui_ImplVulkanH_SelectSurfaceFormat(
        m_physical_device, m_surface, request_formats, 3, VK_COLOR_SPACE_SRGB_NONLINEAR_KHR);

    const VkPresentModeKHR request_modes[] = {VK_PRESENT_MODE_FIFO_KHR, VK_PRESENT_MODE_MAILBOX_KHR};
    wd->PresentMode = ImGui_ImplVulkanH_SelectPresentMode(m_physical_device, m_surface,
                                                          request_modes, 2);

    const uint32_t min_image_count = ImGui_ImplVulkanH_GetMinImageCountFromPresentMode(wd->PresentMode);

    ImGui_ImplVulkanH_CreateOrResizeWindow(m_instance, m_physical_device, m_device, wd,
                                           m_queue_family, nullptr, drawable_w, drawable_h,
                                           min_image_count,
                                           VK_IMAGE_USAGE_COLOR_ATTACHMENT_BIT |
                                               VK_IMAGE_USAGE_TRANSFER_DST_BIT |
                                               VK_IMAGE_USAGE_SAMPLED_BIT);
    m_swapchain_ok = true;

    LOG_INFO("VK: swapchain created (%dx%d, %d images, present mode %d)",
             drawable_w, drawable_h, wd->ImageCount, static_cast<int>(wd->PresentMode));

    if (initial) {
        /* Initialize the ImGui Vulkan backend with the first swapchain. */
        ImGui_ImplVulkan_InitInfo init_info{};
        init_info.ApiVersion = VK_API_VERSION_1_1;
        init_info.Instance = m_instance;
        init_info.PhysicalDevice = m_physical_device;
        init_info.Device = m_device;
        init_info.QueueFamily = m_queue_family;
        init_info.Queue = m_graphics_queue;
        init_info.DescriptorPool = m_descriptor_pool;
        init_info.MinImageCount = min_image_count;
        init_info.ImageCount = wd->ImageCount;
        init_info.PipelineCache = m_pipeline_cache;
        init_info.PipelineInfoMain.RenderPass = wd->RenderPass;
        init_info.PipelineInfoMain.Subpass = 0;
        init_info.PipelineInfoMain.MSAASamples = VK_SAMPLE_COUNT_1_BIT;
        init_info.CheckVkResultFn = vk_check;
        init_info.MinAllocationSize = 1024 * 1024;

        if (!ImGui_ImplVulkan_Init(&init_info)) {
            LOG_ERROR("VK: ImGui_ImplVulkan_Init failed");
            return false;
        }
    } else {
        /* Recreate the backend's main pipeline for the new render pass. */
        ImGui_ImplVulkan_PipelineInfo pipeline_info{};
        pipeline_info.RenderPass = wd->RenderPass;
        pipeline_info.Subpass = 0;
        pipeline_info.MSAASamples = VK_SAMPLE_COUNT_1_BIT;
        ImGui_ImplVulkan_CreateMainPipeline(&pipeline_info);
    }
    return true;
}

void VulkanRenderer::recreate_swapchain()
{
    wait_idle();
    m_swapchain_ok = false;

    /* Tear down the window data so it is rebuilt on the next frame. */
    ImGui_ImplVulkanH_DestroyWindow(m_instance, m_device, &m_wd, nullptr);
}

bool VulkanRenderer::initialize(Window& window)
{
    m_window = &window;

    /* Create the headless EGL display WPE renders into (the dmabuf source). */
    if (!egl_helpers_init()) {
        LOG_ERROR("VK: EGL helpers unavailable (needed for WPE dmabuf export)");
        return false;
    }
    m_wpe_egl_display = egl_helpers_create_headless_display();
    if (m_wpe_egl_display == EGL_NO_DISPLAY) {
        LOG_ERROR("VK: failed to create headless EGL display for WPE");
        return false;
    }

    if (!create_instance())
        return false;
    if (!create_surface_and_device())
        return false;

    create_descriptor_pool();

    m_importer.initialize(m_device, m_physical_device);

    /* Web view sampler (linear filtering, clamped). */
    VkSamplerCreateInfo sampler_info{};
    sampler_info.sType = VK_STRUCTURE_TYPE_SAMPLER_CREATE_INFO;
    sampler_info.magFilter = VK_FILTER_LINEAR;
    sampler_info.minFilter = VK_FILTER_LINEAR;
    sampler_info.mipmapMode = VK_SAMPLER_MIPMAP_MODE_NEAREST;
    sampler_info.addressModeU = VK_SAMPLER_ADDRESS_MODE_CLAMP_TO_EDGE;
    sampler_info.addressModeV = VK_SAMPLER_ADDRESS_MODE_CLAMP_TO_EDGE;
    sampler_info.addressModeW = VK_SAMPLER_ADDRESS_MODE_CLAMP_TO_EDGE;
    vkCreateSampler(m_device, &sampler_info, nullptr, &m_webview_sampler);

    /* The SDL Vulkan presentation is bound to the window; the swapchain is
     * created below. */
    if (!ImGui_ImplSDL3_InitForVulkan(window.sdl_window())) {
        LOG_ERROR("VK: ImGui_ImplSDL3_InitForVulkan failed");
        return false;
    }

    if (!create_swapchain(true))
        return false;

    LOG_INFO("VK: renderer initialized");
    return true;
}

void VulkanRenderer::destroy_webview_texture()
{
    if (m_webview_descriptor) {
        ImGui_ImplVulkan_RemoveTexture(m_webview_descriptor);
        m_webview_descriptor = VK_NULL_HANDLE;
    }
}

void VulkanRenderer::shutdown()
{
    wait_idle();

    destroy_webview_texture();
    m_importer.shutdown();

    if (m_webview_sampler) {
        vkDestroySampler(m_device, m_webview_sampler, nullptr);
        m_webview_sampler = VK_NULL_HANDLE;
    }

    if (m_swapchain_ok)
        ImGui_ImplVulkanH_DestroyWindow(m_instance, m_device, &m_wd, nullptr);

    ImGui_ImplVulkan_Shutdown();
    ImGui_ImplSDL3_Shutdown();

    if (m_descriptor_pool) {
        vkDestroyDescriptorPool(m_device, m_descriptor_pool, nullptr);
        m_descriptor_pool = VK_NULL_HANDLE;
    }
    if (m_surface) {
        vkDestroySurfaceKHR(m_instance, m_surface, nullptr);
        m_surface = VK_NULL_HANDLE;
    }
    if (m_device) {
        vkDestroyDevice(m_device, nullptr);
        m_device = VK_NULL_HANDLE;
    }
    if (m_instance) {
        vkDestroyInstance(m_instance, nullptr);
        m_instance = VK_NULL_HANDLE;
    }
    if (m_wpe_egl_display != EGL_NO_DISPLAY) {
        eglTerminate(static_cast<EGLDisplay>(m_wpe_egl_display));
        m_wpe_egl_display = nullptr;
    }
}

void VulkanRenderer::update_webview_texture(const DmaBufFrame& frame)
{
    int slot = -1;
    VkImageView view = m_importer.import(frame, &slot);
    if (!view)
        return;

    /* Update the descriptor set used by the UI to sample the web view. */
    if (!m_webview_descriptor) {
        m_webview_descriptor = ImGui_ImplVulkan_AddTexture(
            m_webview_sampler, view, VK_IMAGE_LAYOUT_GENERAL);
    } else {
        VkDescriptorImageInfo image_info{};
        image_info.sampler = m_webview_sampler;
        image_info.imageView = view;
        image_info.imageLayout = VK_IMAGE_LAYOUT_GENERAL;

        VkWriteDescriptorSet write{};
        write.sType = VK_STRUCTURE_TYPE_WRITE_DESCRIPTOR_SET;
        write.dstSet = m_webview_descriptor;
        write.dstBinding = 0;
        write.descriptorCount = 1;
        write.descriptorType = VK_DESCRIPTOR_TYPE_COMBINED_IMAGE_SAMPLER;
        write.pImageInfo = &image_info;
        vkUpdateDescriptorSets(m_device, 1, &write, 0, nullptr);
    }

    m_frame_width = frame.width;
    m_frame_height = frame.height;
    m_frame_ready = true;
}

void VulkanRenderer::frame_render()
{
    ImGui_ImplVulkanH_Window* wd = &m_wd;

    /* Recreate the swapchain if the window was resized or invalidated. */
    if (m_resize_pending || !m_swapchain_ok) {
        m_resize_pending = false;
        recreate_swapchain();
        if (!create_swapchain(false))
            return;
    }

    VkSemaphore image_acquired = wd->FrameSemaphores[wd->SemaphoreIndex].ImageAcquiredSemaphore;
    VkSemaphore render_complete = wd->FrameSemaphores[wd->SemaphoreIndex].RenderCompleteSemaphore;

    uint32_t image_index = 0;
    VkResult result = vkAcquireNextImageKHR(m_device, wd->Swapchain, UINT64_MAX,
                                            image_acquired, VK_NULL_HANDLE, &image_index);
    if (result == VK_ERROR_OUT_OF_DATE_KHR || result == VK_SUBOPTIMAL_KHR) {
        recreate_swapchain();
        m_resize_pending = true;
        return;
    }
    if (result != VK_SUCCESS) {
        LOG_ERROR("VK: vkAcquireNextImageKHR failed: %d", static_cast<int>(result));
        return;
    }
    wd->FrameIndex = image_index;

    ImGui_ImplVulkanH_Frame* frame = &wd->Frames[wd->FrameIndex];
    vkWaitForFences(m_device, 1, &frame->Fence, VK_TRUE, UINT64_MAX);
    vkResetFences(m_device, 1, &frame->Fence);
    vkResetCommandPool(m_device, frame->CommandPool, 0);

    VkCommandBuffer command_buffer = frame->CommandBuffer;
    VkCommandBufferBeginInfo begin_info{};
    begin_info.sType = VK_STRUCTURE_TYPE_COMMAND_BUFFER_BEGIN_INFO;
    begin_info.flags |= VK_COMMAND_BUFFER_USAGE_ONE_TIME_SUBMIT_BIT;
    vkBeginCommandBuffer(command_buffer, &begin_info);

    VkClearValue clear_value{};
    clear_value.color = {{0.12f, 0.12f, 0.13f, 1.0f}};

    VkRenderPassBeginInfo render_pass_info{};
    render_pass_info.sType = VK_STRUCTURE_TYPE_RENDER_PASS_BEGIN_INFO;
    render_pass_info.renderPass = wd->RenderPass;
    render_pass_info.framebuffer = frame->Framebuffer;
    render_pass_info.renderArea = {{0, 0}, {static_cast<uint32_t>(wd->Width), static_cast<uint32_t>(wd->Height)}};
    render_pass_info.clearValueCount = 1;
    render_pass_info.pClearValues = &clear_value;
    vkCmdBeginRenderPass(command_buffer, &render_pass_info, VK_SUBPASS_CONTENTS_INLINE);

    ImGui_ImplVulkan_RenderDrawData(ImGui::GetDrawData(), command_buffer);
    vkCmdEndRenderPass(command_buffer);
    vkEndCommandBuffer(command_buffer);

    /* Signal the web view slot's semaphore once, on the first submit that
     * draws the current import, so it can be safely reused later. */
    VkSemaphore extra_signal = m_importer.take_signal_semaphore();

    VkPipelineStageFlags wait_stage = VK_PIPELINE_STAGE_COLOR_ATTACHMENT_OUTPUT_BIT;

    VkSemaphore signal_semaphores[2] = {render_complete, extra_signal};
    const uint32_t signal_count = extra_signal ? 2u : 1u;

    VkSubmitInfo submit_info{};
    submit_info.sType = VK_STRUCTURE_TYPE_SUBMIT_INFO;
    submit_info.waitSemaphoreCount = 1;
    submit_info.pWaitSemaphores = &image_acquired;
    submit_info.pWaitDstStageMask = &wait_stage;
    submit_info.commandBufferCount = 1;
    submit_info.pCommandBuffers = &command_buffer;
    submit_info.signalSemaphoreCount = signal_count;
    submit_info.pSignalSemaphores = signal_semaphores;

    result = vkQueueSubmit(m_graphics_queue, 1, &submit_info, frame->Fence);
    if (result != VK_SUCCESS)
        LOG_ERROR("VK: vkQueueSubmit failed: %d", static_cast<int>(result));
}

void VulkanRenderer::frame_present()
{
    ImGui_ImplVulkanH_Window* wd = &m_wd;
    if (wd->Swapchain == VK_NULL_HANDLE)
        return;

    VkSemaphore render_complete = wd->FrameSemaphores[wd->SemaphoreIndex].RenderCompleteSemaphore;

    VkPresentInfoKHR present_info{};
    present_info.sType = VK_STRUCTURE_TYPE_PRESENT_INFO_KHR;
    present_info.waitSemaphoreCount = 1;
    present_info.pWaitSemaphores = &render_complete;
    present_info.swapchainCount = 1;
    present_info.pSwapchains = &wd->Swapchain;
    present_info.pImageIndices = &wd->FrameIndex;

    const VkResult result = vkQueuePresentKHR(m_graphics_queue, &present_info);
    if (result == VK_ERROR_OUT_OF_DATE_KHR || result == VK_SUBOPTIMAL_KHR) {
        recreate_swapchain();
        m_resize_pending = true;
    }

    wd->SemaphoreIndex = (wd->SemaphoreIndex + 1) % wd->SemaphoreCount;
}

void VulkanRenderer::render_present()
{
    ImGui::Render();
    frame_render();
    frame_present();
}

void VulkanRenderer::wait_idle()
{
    if (m_device)
        vkDeviceWaitIdle(m_device);
}

void* VulkanRenderer::egl_display_for_wpe()
{
    return m_wpe_egl_display;
}

void WebViewImporter::initialize(VkDevice device, VkPhysicalDevice physical_device)

    m_physical_device = physical_device;

    for (int i = 0; i < kSlotCount; ++i) {
        VkSemaphoreCreateInfo info{VK_STRUCTURE_TYPE_SEMAPHORE_CREATE_INFO};
        if (vkCreateSemaphore(m_device, &info, nullptr, &m_slots[i].semaphore) != VK_SUCCESS) {

            m_slots[i].semaphore = VK_NULL_HANDLE;
        }
    }

    /* Verify the device supports dmabuf import. */
    VkPhysicalDeviceExternalBufferInfo ext_info{};
    ext_info.sType = VK_STRUCTURE_TYPE_PHYSICAL_DEVICE_EXTERNAL_BUFFER_INFO;
    ext_info.flags = 0;
    ext_info.usage = VK_BUFFER_USAGE_UNIFORM_TEXEL_BUFFER_BIT;
    ext_info.handleType = VK_EXTERNAL_MEMORY_HANDLE_TYPE_DMA_BUF_BIT_EXT;

    VkExternalBufferProperties ext_props{};
    ext_props.sType = VK_STRUCTURE_TYPE_EXTERNAL_BUFFER_PROPERTIES;
    vkGetPhysicalDeviceExternalBufferProperties(m_physical_device, &ext_info, &ext_props);

    m_dma_buf_supported =
        (ext_props.externalMemoryProperties.externalMemoryFeatures &
         VK_EXTERNAL_MEMORY_FEATURE_IMPORTABLE_BIT) != 0;
    if (!m_dma_buf_supported)
        LOG_ERROR("VK: device does not support dmabuf memory import");
}

void WebViewImporter::shutdown()
{
    if (m_device) {
        for (auto& slot : m_slots) {
            if (slot.semaphore)
                vkDestroySemaphore(m_device, slot.semaphore, nullptr);
            destroy_slot(slot);
        }
    }
    m_current_slot = -1;
}

void WebViewImporter::destroy_slot(Slot& slot)
{
    if (slot.view)
        vkDestroyImageView(m_device, slot.view, nullptr);
    if (slot.memory)
        vkFreeMemory(m_device, slot.memory, nullptr);
    if (slot.image)
        vkDestroyImage(m_device, slot.image, nullptr);
    slot.view = VK_NULL_HANDLE;
    slot.memory = VK_NULL_HANDLE;
    slot.image = VK_NULL_HANDLE;
    slot.in_use = false;
    slot.width = 0;
    slot.height = 0;
    slot.format = VK_FORMAT_UNDEFINED;
}

bool WebViewImporter::wait_slot(Slot& slot)
{
    /* If the slot was used by a previous frame, wait for that submit to
     * complete (the semaphore is signaled by the submit that drew it). */
    if (!slot.in_use)
        return true;
    if (!slot.signal_pending)
        return true; /* never drawn, nothing to wait for */

    VkSemaphoreWaitInfo wait_info{VK_STRUCTURE_TYPE_SEMAPHORE_WAIT_INFO};
    wait_info.semaphoreCount = 1;
    wait_info.pSemaphores = &slot.semaphore;
    const VkResult result = vkWaitSemaphores(m_device, &wait_info, UINT64_MAX);
    if (result != VK_SUCCESS) {
        LOG_ERROR("VK: waiting for import slot failed: %d", static_cast<int>(result));
        return false;
    }
    slot.signal_pending = false;
    return true;
}

uint32_t WebViewImporter::pick_memory_type() const
{
    VkPhysicalDeviceMemoryProperties mem_props{};
    vkGetPhysicalDeviceMemoryProperties(m_physical_device, &mem_props);

    for (uint32_t i = 0; i < mem_props.memoryTypeCount; ++i) {
        VkPhysicalDeviceExternalBufferInfo ext_info{};
        ext_info.sType = VK_STRUCTURE_TYPE_PHYSICAL_DEVICE_EXTERNAL_BUFFER_INFO;
        ext_info.usage = VK_BUFFER_USAGE_UNIFORM_TEXEL_BUFFER_BIT;
        ext_info.handleType = VK_EXTERNAL_MEMORY_HANDLE_TYPE_DMA_BUF_BIT_EXT;

        VkExternalBufferProperties ext_props{};
        ext_props.sType = VK_STRUCTURE_TYPE_EXTERNAL_BUFFER_PROPERTIES;
        vkGetPhysicalDeviceExternalBufferProperties(m_physical_device, &ext_info, &ext_props);

        const bool importable =
            (ext_props.externalMemoryProperties.externalMemoryFeatures &
             VK_EXTERNAL_MEMORY_FEATURE_IMPORTABLE_BIT) != 0;
        const bool device_local =
            (mem_props.memoryTypes[i].propertyFlags & VK_MEMORY_PROPERTY_DEVICE_LOCAL_BIT) != 0;

        if (importable && device_local)
            return i;
    }
    return UINT32_MAX;
}

bool WebViewImporter::create_slot(Slot& slot, const DmaBufFrame& frame, bool* fd_consumed)
{
    const VkFormat format = fourcc_to_vk_format(frame.format);
    *fd_consumed = false;

    /* Each frame is a new dmabuf, so (re)create the image + imported memory. */
    destroy_slot(slot);

    VkExternalMemoryImageCreateInfo ext_image_info{};
    ext_image_info.sType = VK_STRUCTURE_TYPE_EXTERNAL_MEMORY_IMAGE_CREATE_INFO;
    ext_image_info.handleTypes = VK_EXTERNAL_MEMORY_HANDLE_TYPE_DMA_BUF_BIT_EXT;

    VkImageCreateInfo image_info{VK_STRUCTURE_TYPE_IMAGE_CREATE_INFO};
    image_info.pNext = &ext_image_info;
    image_info.imageType = VK_IMAGE_TYPE_2D;
    image_info.format = format;
    image_info.extent = {frame.width, frame.height, 1};
    image_info.mipLevels = 1;
    image_info.arrayLayers = 1;
    image_info.samples = VK_SAMPLE_COUNT_1_BIT;
    image_info.usage = VK_IMAGE_USAGE_SAMPLED_BIT | VK_IMAGE_USAGE_COLOR_ATTACHMENT_BIT;
    image_info.sharingMode = VK_SHARING_MODE_EXCLUSIVE;
    image_info.initialLayout = VK_IMAGE_LAYOUT_UNDEFINED;

    /* Try OPTIMAL tiling first (works with AFBC on VeriSilicon GC7000), then fall
     * back to LINEAR for drivers that only support linear dmabuf import. */
    image_info.tiling = VK_IMAGE_TILING_OPTIMAL;
    VkResult result = vkCreateImage(m_device, &image_info, nullptr, &slot.image);
    if (result != VK_SUCCESS) {
        image_info.tiling = VK_IMAGE_TILING_LINEAR;
        result = vkCreateImage(m_device, &image_info, nullptr, &slot.image);
    }
    if (result != VK_SUCCESS) {
        LOG_ERROR("VK: vkCreateImage for dmabuf import failed: %d", static_cast<int>(result));
        return false;
    }

    const uint32_t memory_type = pick_memory_type();
    if (memory_type == UINT32_MAX) {
        LOG_ERROR("VK: no memory type supports dmabuf import");
        destroy_slot(slot);
        return false;
    }

    VkImportMemoryFdInfoKHR import_fd_info{};
    import_fd_info.sType = VK_STRUCTURE_TYPE_IMPORT_MEMORY_FD_INFO_KHR;
    import_fd_info.handleType = VK_EXTERNAL_MEMORY_HANDLE_TYPE_DMA_BUF_BIT_EXT;
    import_fd_info.fd = frame.fds[0];

    VkMemoryAllocateInfo alloc_info{VK_STRUCTURE_TYPE_MEMORY_ALLOCATE_INFO};
    alloc_info.pNext = &import_fd_info;
    alloc_info.allocationSize = 0;
    alloc_info.memoryTypeIndex = memory_type;

    result = vkAllocateMemory(m_device, &alloc_info, nullptr, &slot.memory);
    if (result != VK_SUCCESS) {
        LOG_ERROR("VK: vkAllocateMemory for dmabuf import failed: %d", static_cast<int>(result));
        destroy_slot(slot);
        return false;
    }

    /* The driver took ownership of the fd on success. */
    *fd_consumed = true;

    /* Close any extra planes the frame carried (not imported). */
    for (uint8_t i = 1; i < frame.n_planes; ++i) {
        if (frame.fds[i] >= 0)
            ::close(frame.fds[i]);
    }

    VkImageViewCreateInfo view_info{VK_STRUCTURE_TYPE_IMAGE_VIEW_CREATE_INFO};
    view_info.image = slot.image;
    view_info.viewType = VK_IMAGE_VIEW_TYPE_2D;
    view_info.format = format;
    view_info.subresourceRange = {VK_IMAGE_ASPECT_COLOR_BIT, 0, 1, 0, 1};

    result = vkCreateImageView(m_device, &view_info, nullptr, &slot.view);
    if (result != VK_SUCCESS) {
        LOG_ERROR("VK: vkCreateImageView for web view failed: %d", static_cast<int>(result));
        destroy_slot(slot);
        return false;
    }

    slot.width = frame.width;
    slot.height = frame.height;
    slot.format = format;
    slot.in_use = true;
    return true;
}

VkImageView WebViewImporter::import(const DmaBufFrame& frame, int* out_slot)
{
    if (!m_device || !m_dma_buf_supported)
        return VK_NULL_HANDLE;

    if (frame.n_planes != 1) {
        LOG_WARN("VK: unsupported multi-plane web view frame (%u planes)", frame.n_planes);
        for (uint8_t i = 0; i < frame.n_planes; ++i) {
            if (frame.fds[i] >= 0)
                ::close(frame.fds[i]);
        }
        return VK_NULL_HANDLE;
    }
    if (frame.fds[0] < 0)
        return VK_NULL_HANDLE;

    Slot& slot = m_slots[m_next_slot];
    if (!wait_slot(slot)) {
        for (uint8_t i = 0; i < frame.n_planes; ++i)
            if (frame.fds[i] >= 0)
                ::close(frame.fds[i]);
        return VK_NULL_HANDLE;
    }

    bool fd_consumed = false;
    if (!create_slot(slot, frame, &fd_consumed)) {
        /* Close plane 0 unless the driver already owns it. */
        if (!fd_consumed && frame.fds[0] >= 0)
            ::close(frame.fds[0]);
        return VK_NULL_HANDLE;
    }

    /* If the slot was reused as-is, plane 0 was not imported and is still
     * owned by us; close it. Extra planes were closed by create_slot. */
    if (!fd_consumed && frame.fds[0] >= 0)
        ::close(frame.fds[0]);

    slot.signal_pending = true;
    m_current_slot = m_next_slot;
    m_next_slot = (m_next_slot + 1) % kSlotCount;

    if (out_slot)
        *out_slot = m_current_slot;
    return slot.view;
}

VkSemaphore WebViewImporter::take_signal_semaphore()
{
    if (m_current_slot < 0)
        return VK_NULL_HANDLE;
    Slot& slot = m_slots[m_current_slot];
    if (!slot.signal_pending)
        return VK_NULL_HANDLE;
    slot.signal_pending = false;
    return slot.semaphore;
}

VkImageView WebViewImporter::current_view() const
{
    if (m_current_slot < 0)
        return VK_NULL_HANDLE;
    return m_slots[m_current_slot].view;
}

uint32_t WebViewImporter::current_width() const
{
    if (m_current_slot < 0)
        return 0;
    return m_slots[m_current_slot].width;
}

uint32_t WebViewImporter::current_height() const
{
    if (m_current_slot < 0)
        return 0;
    return m_slots[m_current_slot].height;
}

/* Completes a user-typed address into a URL. */
std::string complete_url(const std::string& input)
{
    std::string url = input;
    if (url.empty())
        return url;

    /* Trim whitespace. */
    size_t start = url.find_first_not_of(" \\t\\r\\n");
    if (start == std::string::npos)
        return {};
    url = url.substr(start);

    const bool has_scheme = url.find("://") != std::string::npos ||
                            url.rfind("about:", 0) == 0 || url.rfind("data:", 0) == 0 ||
                            url.rfind("file:", 0) == 0;
    if (!has_scheme) {
        /* A dotted or local host is a bare domain; otherwise assume a
         * single search term. */
        const bool looks_like_domain = url.find('.') != std::string::npos;
        if (looks_like_domain)
            url = "https://" + url;
    }
    return url;
}

void BrowserUi::draw(Browser& browser, const WebViewTexture& texture)
{
    ImGuiIO& io = ImGui::GetIO();

    /* In kiosk mode the web view fills the whole window; no toolbar. */
    const float toolbar_height = m_kiosk ? 0.0f : (ImGui::GetFrameHeight() + 4.0f);
    const float viewport_y = toolbar_height;
    const float viewport_height = io.DisplaySize.y - viewport_y;

    if (!m_kiosk)
        draw_toolbar(browser);

    if (viewport_height > 0.0f) {
        /* Draw the web view into the background draw list: it must not be
         * clipped by an ImGui window. */
        ImDrawList* draw_list = ImGui::GetBackgroundDrawList();
        const ImVec2 view_min(0.0f, viewport_y);
        const ImVec2 view_max(io.DisplaySize.x, io.DisplaySize.y);
        if (texture.valid) {
            draw_list->AddImage(ImTextureRef(static_cast<ImTextureID>(texture.handle)),
                                view_min, view_max);
        } else {
            const ImVec2 text_pos(io.DisplaySize.x * 0.5f - 60.0f,
                                  viewport_y + viewport_height * 0.5f - 10.0f);
            draw_list->AddText(text_pos, IM_COL32(210, 210, 210, 255), "Loading...");
        }
    }

    /* Report the web view viewport to the browser. */
    WebViewViewport viewport{};
    viewport.x = 0;
    viewport.y = static_cast<int>(viewport_y);
    viewport.width = static_cast<int>(io.DisplaySize.x);
    viewport.height = static_cast<int>(viewport_height);
    viewport.scale = io.DisplayFramebufferScale.x;
    browser.set_viewport(viewport);
}

void BrowserUi::draw_toolbar(Browser& browser)
{
    static char url_buffer[kAddressBufferSize] = {0};

    WebPage& page = browser.page();

    /* Keep the address bar in sync with the page unless the user is editing. */
    if (!m_address_editing) {
        const std::string page_uri = page.uri();
        if (page_uri != m_last_synced_uri) {
            std::snprintf(url_buffer, kAddressBufferSize, "%s", page_uri.c_str());
            m_last_synced_uri = page_uri;
        }
    }

    if (m_focus_address_bar) {
        ImGui::SetKeyboardFocusHere();
        m_focus_address_bar = false;
    }

    ImGui::BeginMainMenuBar();

    /* Navigation buttons. */
    if (ImGui::MenuItem("Back", nullptr, false, page.can_go_back()))
        page.go_back();
    if (ImGui::MenuItem("Fwd", nullptr, false, page.can_go_forward()))
        page.go_forward();
    if (ImGui::MenuItem("Reload"))
        page.is_loading() ? page.stop() : page.reload();
    if (ImGui::MenuItem("Kiosk"))
        m_kiosk_requested = true;

    /* Status: a fixed-width loading-progress percentage. The page title is
     * shown only in the window frame (OS titlebar), not here. */
    float status_w = 0.0f;
    std::string status;
    const bool loading = page.is_loading();
    const double progress = page.load_progress();
    if (loading || progress >= 1.0) {
        char pct[16] = {0};
        std::snprintf(pct, sizeof(pct), "%.0f%%", progress * 100.0f);
        status = pct;
        status_w = ImGui::CalcTextSize("100%").x + ImGui::GetStyle().ItemSpacing.x;
    }

    ImGui::Separator();
    ImGui::PushItemWidth(-status_w);
    const bool submitted = ImGui::InputText("##address", url_buffer, kAddressBufferSize,
                                            ImGuiInputTextFlags_EnterReturnsTrue |
                                                ImGuiInputTextFlags_AutoSelectAll);
    if (ImGui::IsItemFocused())
        m_address_editing = true;
    else if (m_address_editing)
        m_address_editing = false;
    ImGui::PopItemWidth();

    if (submitted && url_buffer[0] != '\\0') {
        const std::string url = complete_url(url_buffer);
        if (!url.empty())
            page.load_uri(url);
        m_address_editing = false;
        m_last_synced_uri = url;
    }

    /* Progress percentage in a fixed-width slot; empty when idle. */
    ImGui::PushStyleColor(ImGuiCol_Text, ImGui::GetStyle().Colors[ImGuiCol_TextDisabled]);
    if (!status.empty())
        ImGui::TextUnformatted(status.c_str());
    ImGui::PopStyleColor();

    ImGui::EndMainMenuBar();
}

    g_signal_connect(m_web_view, "permission-request", G_CALLBACK(on_permission_request), this);
    g_signal_connect(m_web_view, "web-process-terminated",

        return;

    m_width = width_px;
    m_height = height_px;
    m_scale = scale;

    wpe_view_backend_dispatch_set_size(m_view_backend, m_width, m_height);

void WebPage::set_activity(bool visible, bool focused, bool in_window)
{

    uint32_t add = 0, remove = 0;
    if (visible) add |= wpe_view_activity_state_visible; else remove |= wpe_view_activity_state_visible;
    if (focused) add |= wpe_view_activity_state_focused; else remove |= wpe_view_activity_state_focused;
    if (in_window) add |= wpe_view_activity_state_in_window; else remove |= wpe_view_activity_state_in_window;

    wpe_view_backend_add_activity_state(m_view_backend, add);
    wpe_view_backend_remove_activity_state(m_view_backend, remove);
}

void WebPage::on_export_egl_image(void* data, EGLImageKHR image)
{
    WebPage* page = self(data);
    if (!page->m_sink || !image)
        return;

    LOG_DEBUG("WPE: egl image frame");
    EglFrame frame{ image, page->m_width, page->m_height };
    page->m_sink->on_egl_image(frame);

    /* The GLES renderer copies synchronously during on_egl_image, so the
     * image can be handed back to WPE immediately. */
    wpe_view_backend_exportable_fdo_egl_dispatch_release_image(page->m_exportable, image);
    /* Signal that the frame has been presented so the compositor can
     * release the wl_surface.frame callback and render the next frame. */
    wpe_view_backend_exportable_fdo_dispatch_frame_complete(page->m_exportable);
}

void WebPage::on_export_dmabuf_resource(void* data,
                                        struct wpe_view_backend_exportable_fdo_dmabuf_resource* resource)
{
    WebPage* page = self(data);
    if (!page->m_sink || !resource || !resource->buffer_resource)
        return;

    DmaBufFrame frame{};
    frame.width = resource->width;
    frame.height = resource->height;
    frame.format = resource->format;
    frame.n_planes = resource->n_planes;
    for (uint8_t i = 0; i < resource->n_planes; ++i) {
        frame.fds[i] = resource->fds[i];
        frame.strides[i] = resource->strides[i];
        frame.offsets[i] = resource->offsets[i];
        frame.modifiers[i] = resource->modifiers[i];
    }

    page->m_sink->on_dmabuf(frame);

    /* The Vulkan renderer imports the dmabuf (the driver dups the fd), so
     * the Wayland buffer can be released to WPE immediately. */
    wpe_view_backend_exportable_fdo_dispatch_release_buffer(page->m_exportable,
                                                            resource->buffer_resource);
    wpe_view_backend_exportable_fdo_dispatch_frame_complete(page->m_exportable);
}

void WebPage::on_export_buffer_resource(void* data, struct wl_resource* buffer_resource)
{
    (void)data;
    (void)buffer_resource;
    LOG_WARN("WPE: got an export_buffer_resource frame; not supported");
}

void WebPage::on_export_shm_buffer(void* data, struct wpe_fdo_shm_exported_buffer* buffer)
{
    WebPage* page = self(data);
    if (!page->m_sink || !buffer)
        return;

    struct wl_shm_buffer* shm = wpe_fdo_shm_exported_buffer_get_shm_buffer(buffer);
    if (!shm) {
        wpe_view_backend_exportable_fdo_egl_dispatch_release_shm_exported_buffer(
            page->m_exportable, buffer);
        return;
    }

    const int32_t width = wl_shm_buffer_get_width(shm);
    const int32_t height = wl_shm_buffer_get_height(shm);
    const int32_t stride = wl_shm_buffer_get_stride(shm);
    const uint32_t format = static_cast<uint32_t>(wl_shm_buffer_get_format(shm));
    const uint8_t* pixels = static_cast<const uint8_t*>(wl_shm_buffer_get_data(shm));

    if (width <= 0 || height <= 0 || stride < 0 || !pixels) {
        wpe_view_backend_exportable_fdo_egl_dispatch_release_shm_exported_buffer(
            page->m_exportable, buffer);
        return;
    }

    /* The pool may be reused once the buffer is released, so copy first. */
    const size_t bytes = static_cast<size_t>(height) * static_cast<size_t>(stride);
    std::vector<uint8_t> copy(bytes);
    std::memcpy(copy.data(), pixels, bytes);

    const ShmFrame frame{ copy.data(), static_cast<uint32_t>(width),
                          static_cast<uint32_t>(height), static_cast<uint32_t>(stride),
                          format };
    page->m_sink->on_shm(frame);
    static unsigned shm_frame_count = 0;
    LOG_DEBUG("WPE: shm frame #%u %dx%d stride %d format 0x%08x", ++shm_frame_count,
              width, height, stride, format);
    wpe_view_backend_exportable_fdo_egl_dispatch_release_shm_exported_buffer(
        page->m_exportable, buffer);
    wpe_view_backend_exportable_fdo_dispatch_frame_complete(page->m_exportable);
}

/* -------------------------------------------------------------------------
 * WebKitWebView signals.
 * ---------------------------------------------------------------------- */
void WebPage::on_load_changed(WebKitWebView* view, void* load_event, void* data)
{
    (void)view;
    WebPage* page = self(data);
    const auto event = static_cast<WebKitLoadEvent>(reinterpret_cast<intptr_t>(load_event));

    switch (event) {
    case WEBKIT_LOAD_STARTED:
    case WEBKIT_LOAD_REDIRECTED:
        page->m_loading = true;
        page->m_progress = 0.0;
        break;
    case WEBKIT_LOAD_COMMITTED:
        break;
    case WEBKIT_LOAD_FINISHED:
        page->m_loading = false;
        page->m_progress = 1.0;
        LOG_INFO("WPE: load finished: %s", page->uri().c_str());
        break;
    }
}

void WebPage::on_load_progress(WebKitWebView* view, void* pspec, void* data)
{
    (void)view;
    (void)pspec;
    WebPage* page = self(data);
    page->m_progress = webkit_web_view_get_estimated_load_progress(page->m_web_view);
}

int WebPage::on_permission_request(WebKitWebView* view, void* request, void* data)
{
    (void)view;
    (void)data;

    /* Camera/microphone: grant when media capture is requested. */
    if (WEBKIT_IS_PERMISSION_REQUEST(request)) {
        LOG_DEBUG("WPE: granting permission request");
        webkit_permission_request_allow(WEBKIT_PERMISSION_REQUEST(request));
        return TRUE;
    }
    return FALSE;
}

void WebPage::on_web_process_terminated(WebKitWebView* view, void* reason, void* data)
{
    (void)view;
    WebPage* page = self(data);
    const auto termination = static_cast<WebKitWebProcessTerminationReason>(
        reinterpret_cast<intptr_t>(reason));

    LOG_ERROR("WPE: web process terminated (reason %d); reloading", static_cast<int>(termination));
    if (page->m_web_view)
        webkit_web_view_reload(page->m_web_view);
}

void WebPage::on_web_view_created(WebKitWebView* view, void* data)
{
    (void)view;
    (void)data;
    /* No new windows: reject the request by not returning a WebKitWebView. */
    LOG_WARN("WPE: window.open() requested; ignored");
}

#include "webkit/wpe_module.h"

#include <glib.h>

#include <wpe/wpe.h>
#include <wpe/fdo-egl.h>

#include "logging/log.h"

namespace imwb {

bool WpeModule::initialize(void* egl_display)
{
    if (m_initialized)
        return true;

    if (!egl_display) {
        LOG_ERROR("WPE: no EGL display provided");
        return false;
    }

    /* On Intel GPUs, force the native DRI driver (i965) instead of Zink
     * (OpenGL-over-Vulkan).  Only effective on x86; harmless on ARM. */
#if defined(__x86_64__) || defined(__i386__)
    if (!g_getenv("MESA_LOADER_DRIVER_OVERRIDE"))
        g_setenv("MESA_LOADER_DRIVER_OVERRIDE", "i965", TRUE);
#endif

    /* Disable the WebProcess sandbox so it can access /dev/dri directly.
     * Without this, Mesa falls back to Vulkan/Zink inside the sandbox,
     * causing performance warnings on Haswell GPUs. */
    if (!g_getenv("WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS"))
        g_setenv("WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS", "1", TRUE);

    /* Point libwpe at the FDO backend unless the caller already selected one.
     * (Distros sometimes omit the libWPEBackend-default.so alias.) */
    if (!g_getenv("WPE_BACKEND_LIBRARY"))
        g_setenv("WPE_BACKEND_LIBRARY", "libWPEBackend-fdo-1.0.so", TRUE);

    if (!wpe_fdo_initialize_for_egl_display(egl_display)) {
        LOG_ERROR("WPE: wpe_fdo_initialize_for_egl_display failed");
        return false;
    }

    m_initialized = true;
    LOG_INFO("WPE: initialized on EGL display %p", egl_display);
    return true;
}

void WpeModule::shutdown()
{
    m_initialized = false;
}

void WpeModule::pump_main_context()
{
    /* Non-blocking; WPE's sources run on the default context. */
    while (g_main_context_iteration(nullptr, false))
        ;
}

} /* namespace imwb */
