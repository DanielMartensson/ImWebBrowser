      side: THREE.DoubleSide,
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.position.copy(mesh.position);
    ring.userData = { isRing: true, parent: n.id };
    nodeGroup.add(ring);
  });

  edges.forEach(([fromId, toId]) => {
    const from = nodeMap[fromId], to = nodeMap[toId];
    if (!from || !to) return;

    const points = [new THREE.Vector3(from.x, from.y, from.z), new THREE.Vector3(to.x, to.y, to.z)];
    const geo = new THREE.BufferGeometry().setFromPoints(points);
    const mat = new THREE.LineBasicMaterial({
      color: 0x30363d,
      transparent: true,
      opacity: 0.35,
      linewidth: 1,
    });
    const line = new THREE.Line(geo, mat);
    line.userData = { from: fromId, to: toId };
    edgeGroup.add(line);
    edgeLines.push(line);

    const dir = new THREE.Vector3().subVectors(
      new THREE.Vector3(to.x, to.y, to.z),
      new THREE.Vector3(from.x, from.y, from.z)
    ).normalize();
    const arrowPos = new THREE.Vector3().lerpVectors(
      new THREE.Vector3(from.x, from.y, from.z),
      new THREE.Vector3(to.x, to.y, to.z),
      0.82
    );
    const arrowGeo = new THREE.ConeGeometry(0.05, 0.12, 6);
    const arrowMat = new THREE.MeshBasicMaterial({ color: 0x30363d, transparent: true, opacity: 0.5 });
    const arrow = new THREE.Mesh(arrowGeo, arrowMat);
    arrow.position.copy(arrowPos);
    arrow.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
    arrow.userData = { isArrow: true, from: fromId, to: toId };
    edgeGroup.add(arrow);
  });

  scene.add(nodeGroup);
  scene.add(edgeGroup);
}

function updateMouse(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
}

function hitTest() {
  raycaster.setFromCamera(mouse, camera);
  return raycaster.intersectObjects(nodeObjects);
}

function setupEvents() {
  const tooltip = document.getElementById('tooltip');
  const ttName = tooltip.querySelector('.tt-name');
  const ttFile = tooltip.querySelector('.tt-file');
  const ttDesc = tooltip.querySelector('.tt-desc');
  const ttCalls = tooltip.querySelector('.tt-calls');

  document.addEventListener('mousemove', (e) => {
    if (e.target !== renderer.domElement) {
      tooltip.style.display = 'none';
      renderer.domElement.style.cursor = 'default';
      return;
    }
    updateMouse(e);
    const hits = hitTest();
    if (hits.length > 0) {
      const id = hits[0].object.userData.nodeId;
      const n = nodeMap[id];
      if (n) {
        tooltip.style.display = 'block';
        tooltip.style.left = (e.clientX + 16) + 'px';
        tooltip.style.top = (e.clientY - 10) + 'px';
        ttName.textContent = n.label;
        ttName.style.color = '#' + GROUP_COLORS[n.group].getHexString();
        ttFile.textContent = n.file + ':' + n.line;
        ttDesc.textContent = n.desc;

        const callers = edges.filter(([f, t]) => t === id).map(([f]) => nodeMap[f]?.label || f);
        const callees = edges.filter(([f, t]) => f === id).map(([, t]) => nodeMap[t]?.label || t);
        let callsHtml = '';
        if (callers.length) callsHtml += '<div><b>Calls into this:</b> ' + callers.join(', ') + '</div>';
        if (callees.length) callsHtml += '<div><b>This calls:</b> ' + callees.join(', ') + '</div>';
        ttCalls.innerHTML = callsHtml;

        renderer.domElement.style.cursor = 'pointer';
      }
    } else {
      tooltip.style.display = 'none';
      renderer.domElement.style.cursor = 'default';
    }
  });

  renderer.domElement.addEventListener('click', (e) => {
    updateMouse(e);
    const hits = hitTest();
    if (hits.length > 0) {
      const node = nodeMap[hits[0].object.userData.nodeId];
      selectNode(hits[0].object.userData.nodeId);
      if (node) openCodePanel(node);
    } else {
      deselectAll();
    }
  });

  document.querySelectorAll('#filter button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#filter button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterGroup(btn.dataset.group);
    });
  });

  window.addEventListener('resize', resizeRenderer);
}

function getCanvasWidth() {
  const panelOpen = document.getElementById('code-panel').classList.contains('open');
  return panelOpen ? window.innerWidth - 520 : window.innerWidth;
}

function resizeRenderer() {
  const panelOpen = document.getElementById('code-panel').classList.contains('open');
  const w = panelOpen ? window.innerWidth - 520 : window.innerWidth;
  camera.aspect = w / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(w, window.innerHeight);
}

function selectNode(id) {
  deselectAll();
  selectedNode = id;

  const connected = new Set();
  edges.forEach(([f, t]) => {
    if (f === id || t === id) {
      connected.add(f);
      connected.add(t);
      edgeLines.forEach(line => {
        if ((line.userData.from === f && line.userData.to === t) ||
            (line.userData.from === t && line.userData.to === f)) {
          line.material.color.setHex(0x58a6ff);
          line.material.opacity = 0.9;
          highlightedEdges.push(line);
        }
      });
    }
  });

  nodeObjects.forEach(obj => {
    if (!connected.has(obj.userData.nodeId)) {
      obj.material.opacity = 0.15;
      obj.material.emissiveIntensity = 0.05;
    } else if (obj.userData.nodeId === id) {
      obj.material.emissiveIntensity = 0.8;
      obj.scale.setScalar(1.4);
    } else {
      obj.material.emissiveIntensity = 0.5;
    }
  });
}

function deselectAll() {
  selectedNode = null;
  highlightedEdges.forEach(line => {
    line.material.color.setHex(0x30363d);
    line.material.opacity = 0.35;
  });
  highlightedEdges = [];
  nodeObjects.forEach(obj => {
    obj.material.opacity = 0.9;
    obj.material.emissiveIntensity = 0.3;
    obj.scale.setScalar(1);
  });
}

function filterGroup(group) {
  nodeObjects.forEach(obj => {
    obj.visible = (group === 'all' || obj.userData.group === group);
  });
  edgeLines.forEach(line => {
    const fromNode = nodeMap[line.userData.from];
    const toNode = nodeMap[line.userData.to];
    line.visible = (group === 'all' ||
        (fromNode && fromNode.group === group) ||
        (toNode && toNode.group === group));
  });
}

function animate() {
  requestAnimationFrame(animate);
  controls.update();

  const t = performance.now() * 0.001;
  nodeObjects.forEach((obj, i) => {
    if (!selectedNode || obj.userData.nodeId === selectedNode ||
        edges.some(([f, t2]) => (f === selectedNode && t2 === obj.userData.nodeId) ||
                                  (t2 === selectedNode && f === obj.userData.nodeId))) {
      obj.position.y = nodeMap[obj.userData.nodeId].y + Math.sin(t + i * 0.7) * 0.015;
    }
  });

  renderer.render(scene, camera);
}

// =============================================
// CODE PANEL
// =============================================
const KEYWORDS = new Set([
  'void','int','bool','char','long','short','unsigned','signed','float','double',
  'return','if','else','for','while','do','switch','case','break','continue',
  'true','false','nullptr','this',
  'constexpr','static','const','auto','struct','class','enum','namespace',
  'public','private','protected','virtual','override','inline','explicit',
  'mutable','volatile','noexcept','delete','new','sizeof',
  'static_cast','dynamic_cast','reinterpret_cast','const_cast',
  'template','typename','using','typedef','default','operator',
  'friend','extern','register','goto','throw','try','catch','union',
]);

const TYPES = new Set([
  'uint32_t','uint8_t','int32_t','uint64_t','int64_t','size_t','ssize_t',
  'std','string','vector','array','map','set','pair','optional',
  'EGLDisplay','EGLContext','EGLImageKHR','EGLint','EGLBoolean','EGLNativeDisplayType',
  'VkResult','VkDevice','VkInstance','VkPhysicalDevice','VkFormat','VkImage',
  'VkImageView','VkSampler','VkSemaphore','VkDescriptorPool','VkSurfaceKHR',
  'VkCommandBuffer','VkFramebuffer','VkRenderPass','VkPipeline',
  'SDL_Event','SDL_Scancode','SDL_Window','Uint32','Uint64',
  'GLint','GLuint','GLenum','GLfloat','GLsizei','GLeglImageOES',
  'xkb_context','xkb_keymap','xkb_state','xkb_rule_names','xkb_keysym_t',
  'xkb_compose_table','xkb_compose_state',
  'GMainContext','GObject',
  'WebKitWebView','WebKitSettings','WebKitUserScript','WebKitUserContentManager',
  'WebKitWebViewBackend','WebKitLoadEvent','WebKitWebProcessTerminationReason',
  'ImDrawList','ImVec2','ImVec4','ImTextureRef','ImTextureID','ImGuiIO',
  'FILE','va_list','EGLConfig',
  'Renderer','GlRenderer','VulkanRenderer','Window','Config','Browser','BrowserUi',
  'WebPage','InputTranslator','XkbLayout','WpeModule','WebViewImporter',
  'FrameSink','EglFrame','DmaBufFrame','ShmFrame','LogLevel','WebViewViewport',
  'WebViewTexture','Slot','Fourcc',
]);

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlightSyntax(text) {
  let result = '';
  let i = 0;
  while (i < text.length) {
    if (text[i] === '/' && text[i+1] === '/') {
      result += '<span class="syn-cm">' + escHtml(text.substring(i)) + '</span>';
      return result;
    }
    if (text[i] === '/' && text[i+1] === '*') {
      const end = text.indexOf('*/', i + 2);
      if (end === -1) {
        result += '<span class="syn-cm">' + escHtml(text.substring(i)) + '</span>';
        return result;
      }
      result += '<span class="syn-cm">' + escHtml(text.substring(i, end + 2)) + '</span>';
      i = end + 2;
      continue;
    }
    if (text[i] === '"') {
      let j = i + 1;
      while (j < text.length) {
        if (text[j] === '\\') { j += 2; continue; }
        if (text[j] === '"') { j++; break; }
        j++;
      }
      result += '<span class="syn-st">' + escHtml(text.substring(i, j)) + '</span>';
      i = j;
      continue;
    }
    if (text[i] === "'" && (i === 0 || !text[i-1].match(/\w/))) {
      let j = i + 1;
      while (j < text.length) {
        if (text[j] === '\\') { j += 2; continue; }
        if (text[j] === "'") { j++; break; }
        j++;
      }
      result += '<span class="syn-st">' + escHtml(text.substring(i, j)) + '</span>';
      i = j;
      continue;
    }
    if (text[i] === '#' && text.substring(0, i).trim() === '') {
      result += '<span class="syn-pp">' + escHtml(text.substring(i)) + '</span>';
      return result;
    }
    if (/[0-9]/.test(text[i]) && (i === 0 || !/[a-zA-Z_]/.test(text[i-1]))) {
      let j = i;
      while (j < text.length && /[0-9a-fA-FxXulUL.]/.test(text[j])) j++;
      result += '<span class="syn-nu">' + escHtml(text.substring(i, j)) + '</span>';
      i = j;
      continue;
    }
    if (/[a-zA-Z_]/.test(text[i])) {
      let j = i;
      while (j < text.length && /[a-zA-Z0-9_]/.test(text[j])) j++;
      const word = text.substring(i, j);
      if (KEYWORDS.has(word)) {
        result += '<span class="syn-kw">' + escHtml(word) + '</span>';
      } else if (TYPES.has(word)) {
        result += '<span class="syn-ty">' + escHtml(word) + '</span>';
      } else if (j < text.length && text[j] === '(') {
        result += '<span class="syn-fn">' + escHtml(word) + '</span>';
      } else {
        result += escHtml(word);
      }
      i = j;
      continue;
    }
    result += escHtml(text[i]);
    i++;
  }
  return result;
}

function findFunctionRange(source, targetLine) {
  const lines = source.split('\n');
  let start = targetLine - 1;

  while (start < lines.length && !lines[start].includes('{')) {
    start++;
  }
  if (start >= lines.length) start = targetLine - 1;

  let braceCount = 0;
  let foundOpen = false;
  let end = start;
  for (let i = start; i < lines.length; i++) {
    for (const ch of lines[i]) {
      if (ch === '{') { braceCount++; foundOpen = true; }
      if (ch === '}') braceCount--;
    }
    if (foundOpen && braceCount === 0) { end = i; break; }
  }

  return { start: targetLine - 1, end };
}

function openCodePanel(node) {
  const panel = document.getElementById('code-panel');
  const src = SRC[node.file];
  if (!src) return;

  currentPanelNode = node;

  const lines = src.split('\n');
  const totalLines = lines.length;
  const fnRange = findFunctionRange(src, node.line);

  document.querySelector('#code-panel-header .file-name').textContent = node.file;
  document.querySelector('#code-panel-header .file-line').textContent = node.label + ' : line ' + node.line;
  document.getElementById('footer-file').textContent = node.file;
  document.getElementById('footer-lines').textContent = totalLines + ' lines';

  let html = '';
  for (let i = 0; i < lines.length; i++) {
    let cls = 'code-line';
    if (i === fnRange.start) cls += ' highlight-start';
    else if (i > fnRange.start && i <= fnRange.end) cls += ' highlight';
    html += '<div class="' + cls + '"><div class="code-line-num">' + (i + 1) + '</div><div class="code-line-text">' + highlightSyntax(lines[i]) + '</div></div>';
  }
  document.getElementById('code-content').innerHTML = html;

  panel.classList.add('open');
  setTimeout(() => {
    resizeRenderer();
    const highlighted = document.querySelector('.code-line.highlight-start');
    if (highlighted) highlighted.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }, 50);
}

function closeCodePanel() {
  document.getElementById('code-panel').classList.remove('open');
  currentPanelNode = null;
  setTimeout(resizeRenderer, 50);
}

document.getElementById('btn-close-panel').addEventListener('click', closeCodePanel);

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeCodePanel();
});

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), 2000);
}

document.getElementById('btn-copy-path').addEventListener('click', () => {
  if (!currentPanelNode) return;
  const text = currentPanelNode.file + ':' + currentPanelNode.line;
  navigator.clipboard.writeText(text).then(() => showToast('Copied: ' + text));
});

document.getElementById('btn-vscode').addEventListener('click', () => {
  if (!currentPanelNode) return;
  const text = 'code -g ' + currentPanelNode.file + ':' + currentPanelNode.line;
  navigator.clipboard.writeText(text).then(() => showToast('Copied: ' + text));
});
